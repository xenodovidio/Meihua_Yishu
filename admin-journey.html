<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学习之旅 · 内容管理</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1410;--ink2:#3d3328;--ink3:#7a6e63;--ink4:#b0a89e;
  --paper:#f5f0e8;--paper2:#ede7d8;--paper3:#e0d8c8;
  --gold:#b8912a;--gold2:#d4aa4a;--red:#8b2020;--jade:#2d6e5a;
  --sidebar:240px;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;}

/* ── 侧边栏 ── */
.sidebar{width:var(--sidebar);min-height:100vh;background:rgba(237,231,216,.8);border-right:1px solid var(--paper3);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.sidebar-logo{padding:20px;border-bottom:1px solid var(--paper3);}
.sidebar-logo-main{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:.1em;}
.sidebar-logo-sub{font-size:11px;color:var(--ink4);margin-top:3px;}
.sidebar-section{padding:12px 16px 6px;font-size:11px;color:var(--ink4);letter-spacing:.12em;}
.chapter-item{border-bottom:1px solid var(--paper3);}
.chapter-header{display:flex;align-items:center;gap:8px;padding:10px 16px;cursor:pointer;transition:background .2s;}
.chapter-header:hover{background:rgba(184,145,42,.06);}
.chapter-header.active{background:rgba(184,145,42,.08);}
.chapter-arrow{font-size:10px;color:var(--ink4);transition:transform .2s;flex-shrink:0;}
.chapter-arrow.open{transform:rotate(90deg);}
.chapter-name{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink2);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chapter-actions{display:flex;gap:4px;opacity:0;transition:opacity .2s;}
.chapter-header:hover .chapter-actions{opacity:1;}
.icon-btn{background:none;border:none;cursor:pointer;padding:2px 4px;font-size:12px;color:var(--ink4);border-radius:3px;transition:all .15s;}
.icon-btn:hover{background:rgba(184,145,42,.12);color:var(--gold);}
.icon-btn.danger:hover{background:rgba(139,32,32,.08);color:var(--red);}
.lesson-list{padding:4px 0 8px;}
.lesson-item{display:flex;align-items:center;gap:6px;padding:6px 16px 6px 32px;cursor:pointer;transition:background .2s;border-radius:0;}
.lesson-item:hover{background:rgba(184,145,42,.05);}
.lesson-item.active{background:rgba(184,145,42,.1);}
.lesson-dot{width:6px;height:6px;border-radius:50%;background:var(--paper3);flex-shrink:0;}
.lesson-item.active .lesson-dot{background:var(--gold);}
.lesson-item-name{font-size:12px;color:var(--ink3);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.lesson-item.active .lesson-item-name{color:var(--ink);}
.lesson-item-actions{display:flex;gap:2px;opacity:0;}
.lesson-item:hover .lesson-item-actions{opacity:1;}
.add-btn{margin:8px 16px;background:none;border:1px dashed var(--paper3);border-radius:6px;padding:6px;font-size:12px;color:var(--ink4);cursor:pointer;width:calc(100% - 32px);transition:all .2s;text-align:center;}
.add-btn:hover{border-color:var(--gold2);color:var(--gold);}
.sidebar-footer{margin-top:auto;padding:16px;border-top:1px solid var(--paper3);}
.save-all-btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:10px;font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer;transition:all .2s;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;gap:6px;}
.save-all-btn:hover{background:var(--ink2);}
.save-all-btn.saving{background:var(--jade);}
.save-status{font-size:11px;color:var(--ink4);text-align:center;margin-top:6px;}

/* ── 主内容区 ── */
.main{flex:1;min-height:100vh;overflow-y:auto;}
.topbar{padding:16px 28px;border-bottom:1px solid var(--paper3);display:flex;align-items:center;gap:14px;background:rgba(245,240,232,.96);position:sticky;top:0;z-index:10;backdrop-filter:blur(8px);}
.topbar-title{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:500;color:var(--ink);flex:1;}
.topbar-badge{font-size:11px;padding:3px 10px;border-radius:20px;background:rgba(184,145,42,.1);color:var(--gold);border:1px solid rgba(184,145,42,.2);}
.content-area{padding:28px;}

/* 空状态 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:400px;gap:14px;color:var(--ink4);}
.empty-icon{font-size:40px;opacity:.4;}
.empty-text{font-family:'Noto Serif SC',serif;font-size:15px;}
.empty-sub{font-size:12px;}

/* 关卡编辑器 */
.editor-section{margin-bottom:28px;}
.section-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.section-title{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--ink2);display:flex;align-items:center;gap:8px;}
.section-title::before{content:'';display:block;width:3px;height:15px;background:var(--gold);border-radius:2px;flex-shrink:0;}
.section-add{margin-left:auto;background:none;border:1px solid var(--paper3);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--ink3);cursor:pointer;transition:all .2s;}
.section-add:hover{border-color:var(--gold2);color:var(--gold);}

/* 基本信息 */
.meta-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:20px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field-label{font-size:11px;color:var(--ink4);letter-spacing:.06em;}
.field-input{background:rgba(245,240,232,.9);border:1px solid var(--paper3);border-radius:7px;padding:9px 12px;font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--ink);outline:none;transition:border-color .2s;}
.field-input:focus{border-color:var(--gold2);}
.field-textarea{resize:vertical;min-height:70px;line-height:1.7;}

/* 教学卡片 */
.teach-card-editor{background:rgba(237,231,216,.5);border:1px solid var(--paper3);border-radius:10px;padding:16px;margin-bottom:12px;position:relative;}
.teach-card-editor:hover{border-color:var(--gold2);}
.card-header{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.card-num{width:22px;height:22px;background:var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;color:white;font-weight:600;flex-shrink:0;}
.card-title-label{font-size:12px;color:var(--ink3);flex:1;}
.card-remove{background:none;border:none;cursor:pointer;padding:3px 6px;font-size:13px;color:var(--ink4);border-radius:4px;transition:all .15s;}
.card-remove:hover{background:rgba(139,32,32,.08);color:var(--red);}
.card-fields{display:grid;grid-template-columns:80px 1fr;gap:10px;margin-bottom:10px;}
.card-body-field{grid-column:1/-1;}
.toggle-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
.toggle-label{font-size:12px;color:var(--ink3);}
.toggle{width:36px;height:20px;background:var(--paper3);border-radius:10px;cursor:pointer;position:relative;transition:background .2s;border:none;flex-shrink:0;}
.toggle.on{background:var(--jade);}
.toggle::after{content:'';position:absolute;width:14px;height:14px;background:white;border-radius:50%;top:3px;left:3px;transition:left .2s;}
.toggle.on::after{left:19px;}

/* 题目卡片 */
.quiz-card-editor{background:rgba(237,231,216,.5);border:1px solid var(--paper3);border-radius:10px;padding:16px;margin-bottom:12px;}
.quiz-card-editor:hover{border-color:rgba(139,32,32,.25);}
.quiz-type-badge{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(139,32,32,.08);color:var(--red);border:1px solid rgba(139,32,32,.2);}
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;}
.opt-field{display:flex;align-items:center;gap:6px;}
.opt-radio{width:14px;height:14px;accent-color:var(--jade);cursor:pointer;flex-shrink:0;}
.opt-input{flex:1;background:rgba(245,240,232,.9);border:1px solid var(--paper3);border-radius:6px;padding:7px 10px;font-size:12px;color:var(--ink);outline:none;transition:border-color .2s;}
.opt-input:focus{border-color:var(--gold2);}
.opt-field.correct .opt-input{border-color:var(--jade);background:rgba(45,110,90,.04);}

/* 章节编辑弹窗 */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,20,16,.5);z-index:100;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--paper);border:1px solid var(--paper3);border-radius:12px;padding:24px;width:340px;animation:fadeUp .25s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.modal-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:16px;}
.modal-actions{display:flex;gap:10px;margin-top:18px;}
.modal-btn{flex:1;border-radius:7px;padding:10px;font-family:'Noto Serif SC',serif;font-size:13px;cursor:pointer;transition:all .2s;}
.modal-btn.primary{background:var(--ink);color:var(--paper);border:none;}
.modal-btn.primary:hover{background:var(--ink2);}
.modal-btn.secondary{background:none;border:1px solid var(--paper3);color:var(--ink3);}
.modal-btn.secondary:hover{border-color:var(--ink3);}

/* toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:200;white-space:nowrap;}
.toast.show{opacity:1;}
</style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar">
  <div class="sidebar-logo">
    <div class="sidebar-logo-main">学习之旅管理</div>
    <div class="sidebar-logo-sub">Journey Content Editor</div>
  </div>
  <div class="sidebar-section">章节与关卡</div>
  <div id="sidebar-chapters"></div>
  <button class="add-btn" style="margin:8px 16px 4px;" onclick="addChapter()">＋ 新增章节</button>
  <div class="sidebar-footer">
    <button class="save-all-btn" id="save-btn" onclick="saveAll()">
      <span>💾</span><span id="save-btn-text">保存到 COS</span>
    </button>
    <div class="save-status" id="save-status"></div>
  </div>
</aside>

<!-- 主内容 -->
<div class="main">
  <div class="topbar">
    <div class="topbar-title" id="topbar-title">选择关卡开始编辑</div>
    <div class="topbar-badge" id="topbar-badge" style="display:none"></div>
  </div>
  <div class="content-area" id="content-area">
    <div class="empty-state">
      <div class="empty-icon">📖</div>
      <div class="empty-text">从左侧选择一个关卡</div>
      <div class="empty-sub">或新增章节和关卡开始编辑</div>
    </div>
  </div>
</div>

<!-- 弹窗 -->
<div class="modal-overlay" id="modal" onclick="closeModal(event)">
  <div class="modal" id="modal-inner">
    <div class="modal-title" id="modal-title"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="modal-btn secondary" onclick="closeModal()">取消</button>
      <button class="modal-btn primary" id="modal-confirm">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/cos-js-sdk-v5@1/dist/cos-js-sdk-v5.min.js"></script>
<script>
/* ── COS 配置 ── */
const COS_CONFIG = {
  SecretId:  'AKID9B8sOgliV8ZoqeIk074oKcjiV7ZrPuDJ',
  SecretKey: 'znOlura5MRK4as0viYIrJXXM0fBao11n',
  Bucket:    'meihua-yishu-1433827621',
  Region:    'ap-shanghai',
};
const COS_KEY = 'journey_data.json';

const cos = new COS({ SecretId: COS_CONFIG.SecretId, SecretKey: COS_CONFIG.SecretKey });

function cosGet(key){
  return new Promise(resolve=>{
    cos.getObject({ Bucket:COS_CONFIG.Bucket, Region:COS_CONFIG.Region, Key:key },
      (err,data)=>{ if(err){resolve(null);return;} try{resolve(JSON.parse(data.Body));}catch{resolve(null);} });
  });
}
function cosPut(key,data){
  return new Promise(resolve=>{
    cos.putObject({ Bucket:COS_CONFIG.Bucket, Region:COS_CONFIG.Region, Key:key,
      Body:JSON.stringify(data,null,2), ContentType:'application/json' },
      err=>resolve(!err));
  });
}

/* ── 数据结构 ── */
let journeyData = { chapters:[], lessons:[] };
let currentLessonId = null;
let expandedChapters = new Set();

/* ── 初始化 ── */
async function init(){
  showToast('正在加载数据…');
  const data = await cosGet(COS_KEY);
  if(data){ journeyData = data; showToast('数据加载成功'); }
  else{ showToast('未找到云端数据，使用空白模板'); }
  renderSidebar();
}

/* ── 侧边栏渲染 ── */
function renderSidebar(){
  const el = document.getElementById('sidebar-chapters');
  if(!journeyData.chapters.length){
    el.innerHTML = '<div style="padding:12px 16px;font-size:12px;color:var(--ink4);">暂无章节，点击下方新增</div>';
    return;
  }
  el.innerHTML = journeyData.chapters.map((ch,ci)=>{
    const isOpen = expandedChapters.has(ch.id);
    const lessons = journeyData.lessons.filter(l=>l.chapterId===ch.id);
    return `
      <div class="chapter-item">
        <div class="chapter-header${isOpen?' active':''}" onclick="toggleChapter('${ch.id}')">
          <span class="chapter-arrow${isOpen?' open':''}">›</span>
          <span class="chapter-name">${ch.title}</span>
          <div class="chapter-actions">
            <button class="icon-btn" onclick="editChapter(event,'${ch.id}')">✎</button>
            <button class="icon-btn danger" onclick="deleteChapter(event,'${ch.id}')">✕</button>
          </div>
        </div>
        ${isOpen?`
        <div class="lesson-list">
          ${lessons.map(l=>`
            <div class="lesson-item${currentLessonId===l.id?' active':''}" onclick="selectLesson('${l.id}')">
              <div class="lesson-dot"></div>
              <span class="lesson-item-name">${l.icon||'📖'} ${l.name||'未命名关卡'}</span>
              <div class="lesson-item-actions">
                <button class="icon-btn danger" onclick="deleteLesson(event,'${l.id}')">✕</button>
              </div>
            </div>`).join('')}
          <button class="add-btn" onclick="addLesson('${ch.id}')">＋ 新增关卡</button>
        </div>`:''} 
      </div>`;
  }).join('');
}

function toggleChapter(id){
  if(expandedChapters.has(id)) expandedChapters.delete(id);
  else expandedChapters.add(id);
  renderSidebar();
}

/* ── 关卡选择 ── */
function selectLesson(id){
  currentLessonId = id;
  renderSidebar();
  renderEditor();
}

/* ── 编辑器渲染 ── */
function renderEditor(){
  const lesson = journeyData.lessons.find(l=>l.id===currentLessonId);
  if(!lesson){ document.getElementById('content-area').innerHTML='<div class="empty-state"><div class="empty-icon">📖</div><div class="empty-text">选择关卡开始编辑</div></div>'; return; }

  document.getElementById('topbar-title').textContent = lesson.name || '未命名关卡';
  document.getElementById('topbar-badge').style.display='';
  document.getElementById('topbar-badge').textContent = `${(lesson.teaches||[]).length} 教学 · ${(lesson.quizzes||[]).length} 题目`;

  document.getElementById('content-area').innerHTML = `
    <!-- 基本信息 -->
    <div class="editor-section">
      <div class="section-header"><div class="section-title">基本信息</div></div>
      <div class="meta-grid">
        <div class="field"><div class="field-label">关卡名称</div><input class="field-input" id="f-name" value="${esc(lesson.name||'')}" oninput="updateField('name',this.value)"></div>
        <div class="field"><div class="field-label">图标（emoji）</div><input class="field-input" id="f-icon" value="${esc(lesson.icon||'')}" oninput="updateField('icon',this.value)" style="font-size:18px;text-align:center;"></div>
        <div class="field"><div class="field-label">简介</div><input class="field-input" id="f-desc" value="${esc(lesson.desc||'')}" oninput="updateField('desc',this.value)"></div>
      </div>
    </div>

    <!-- 教学内容 -->
    <div class="editor-section">
      <div class="section-header">
        <div class="section-title">教学内容</div>
        <button class="section-add" onclick="addTeach()">＋ 新增教学卡</button>
      </div>
      <div id="teaches-container">
        ${(lesson.teaches||[]).map((t,i)=>renderTeachCard(t,i)).join('')}
      </div>
    </div>

    <!-- 题目 -->
    <div class="editor-section">
      <div class="section-header">
        <div class="section-title">题目</div>
        <button class="section-add" onclick="addQuiz()">＋ 新增题目</button>
      </div>
      <div id="quizzes-container">
        ${(lesson.quizzes||[]).map((q,i)=>renderQuizCard(q,i)).join('')}
      </div>
    </div>`;
}

function renderTeachCard(t,i){
  return `
    <div class="teach-card-editor" id="teach-${i}">
      <div class="card-header">
        <div class="card-num">${i+1}</div>
        <div class="card-title-label">教学卡片 ${i+1}</div>
        <button class="card-remove" onclick="removeTeach(${i})">✕</button>
      </div>
      <div class="card-fields">
        <div class="field"><div class="field-label">图标</div><input class="field-input" value="${esc(t.icon||'')}" style="font-size:16px;text-align:center;" oninput="updateTeach(${i},'icon',this.value)"></div>
        <div class="field"><div class="field-label">标题</div><input class="field-input" value="${esc(t.title||'')}" oninput="updateTeach(${i},'title',this.value)"></div>
        <div class="field card-body-field"><div class="field-label">内容（支持 &lt;strong&gt; &lt;br&gt; 等HTML标签）</div><textarea class="field-input field-textarea" oninput="updateTeach(${i},'body',this.value)">${esc(t.body||'')}</textarea></div>
      </div>
      <div class="toggle-row">
        <span class="toggle-label">显示八卦图表</span>
        <button class="toggle${t.showBagua?' on':''}" onclick="toggleTeachBagua(${i},this)"></button>
      </div>
    </div>`;
}

function renderQuizCard(q,i){
  const opts = q.opts||['','','',''];
  return `
    <div class="quiz-card-editor" id="quiz-${i}">
      <div class="card-header">
        <div class="card-num" style="background:var(--red);">${i+1}</div>
        <div class="card-title-label">题目 ${i+1}</div>
        <span class="quiz-type-badge">${q.type||'simple'}</span>
        <button class="card-remove" onclick="removeQuiz(${i})">✕</button>
      </div>
      <div class="field" style="margin-bottom:10px;">
        <div class="field-label">题目类型</div>
        <select class="field-input" onchange="updateQuiz(${i},'type',this.value)">
          ${['simple','name2lines','lines2name','attr','wx','xiang','attr2gua','xiang2gua','tiyong_basic','tiyong_judge','tiyong_rel','jixiong','jixiong_full','hugua_simple','biangua_simple','biangua_calc'].map(t=>`<option value="${t}"${q.type===t?' selected':''}>${t}</option>`).join('')}
        </select>
      </div>
      <div class="field" style="margin-bottom:10px;">
        <div class="field-label">题目</div>
        <textarea class="field-input field-textarea" style="min-height:50px;" oninput="updateQuiz(${i},'q',this.value)">${esc(q.q||'')}</textarea>
      </div>
      <div class="field-label" style="margin-bottom:6px;">选项（选中正确答案）</div>
      <div class="opts-grid">
        ${opts.map((o,oi)=>`
          <div class="opt-field${String(o)===String(q.answer)?' correct':''}">
            <input type="radio" class="opt-radio" name="quiz-ans-${i}" ${String(o)===String(q.answer)?'checked':''} onchange="updateQuizAnswer(${i},'${oi}')">
            <input class="opt-input" value="${esc(String(o))}" oninput="updateQuizOpt(${i},${oi},this.value)" placeholder="选项 ${oi+1}">
          </div>`).join('')}
      </div>
    </div>`;
}

/* ── 数据更新 ── */
function getLesson(){ return journeyData.lessons.find(l=>l.id===currentLessonId); }

function updateField(key,val){
  const l=getLesson(); if(!l)return;
  l[key]=val;
  if(key==='name'){ document.getElementById('topbar-title').textContent=val||'未命名关卡'; renderSidebar(); }
}

function updateTeach(i,key,val){ const l=getLesson(); if(!l||!l.teaches[i])return; l.teaches[i][key]=val; }
function toggleTeachBagua(i,btn){ const l=getLesson(); if(!l||!l.teaches[i])return; l.teaches[i].showBagua=!l.teaches[i].showBagua; btn.classList.toggle('on'); }
function removeTeach(i){ const l=getLesson(); if(!l)return; l.teaches.splice(i,1); renderEditor(); }

function addTeach(){
  const l=getLesson(); if(!l)return;
  if(!l.teaches)l.teaches=[];
  l.teaches.push({icon:'📖',title:'新教学卡片',body:'在这里输入教学内容…',showBagua:false});
  renderEditor();
  setTimeout(()=>{ const el=document.getElementById(`teach-${l.teaches.length-1}`); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

function updateQuiz(i,key,val){ const l=getLesson(); if(!l||!l.quizzes[i])return; l.quizzes[i][key]=val; if(key==='type')renderEditor(); }
function updateQuizOpt(i,oi,val){
  const l=getLesson(); if(!l||!l.quizzes[i])return;
  const q=l.quizzes[i];
  const wasAnswer = String(q.opts[oi])===String(q.answer);
  q.opts[oi]=val;
  if(wasAnswer) q.answer=val;
  // 更新样式
  const optFields=document.querySelectorAll(`#quiz-${i} .opt-field`);
  optFields.forEach((f,fi)=>{ f.classList.toggle('correct', String(q.opts[fi])===String(q.answer)); });
}
function updateQuizAnswer(i,oi){
  const l=getLesson(); if(!l||!l.quizzes[i])return;
  l.quizzes[i].answer=l.quizzes[i].opts[oi];
  const optFields=document.querySelectorAll(`#quiz-${i} .opt-field`);
  optFields.forEach((f,fi)=>{ f.classList.toggle('correct', fi===parseInt(oi)); });
}
function removeQuiz(i){ const l=getLesson(); if(!l)return; l.quizzes.splice(i,1); renderEditor(); }

function addQuiz(){
  const l=getLesson(); if(!l)return;
  if(!l.quizzes)l.quizzes=[];
  l.quizzes.push({type:'simple',q:'题目内容',answer:'正确答案',opts:['正确答案','选项2','选项3','选项4']});
  renderEditor();
  setTimeout(()=>{ const el=document.getElementById(`quiz-${l.quizzes.length-1}`); if(el)el.scrollIntoView({behavior:'smooth',block:'center'}); },100);
}

/* ── 章节管理 ── */
function addChapter(){
  showModal('新增章节', `<div class="field"><div class="field-label">章节名称</div><input class="field-input" id="m-input" value="第${journeyData.chapters.length+1}章 · 新章节" style="width:100%;"></div>`,
    ()=>{
      const title=document.getElementById('m-input').value.trim();
      if(!title)return;
      const id='ch_'+Date.now();
      journeyData.chapters.push({id,title});
      expandedChapters.add(id);
      renderSidebar();
      closeModal();
    });
}

function editChapter(e,id){
  e.stopPropagation();
  const ch=journeyData.chapters.find(c=>c.id===id);
  if(!ch)return;
  showModal('编辑章节名称',`<div class="field"><div class="field-label">章节名称</div><input class="field-input" id="m-input" value="${esc(ch.title)}" style="width:100%;"></div>`,
    ()=>{ const v=document.getElementById('m-input').value.trim(); if(v){ch.title=v;renderSidebar();} closeModal(); });
}

function deleteChapter(e,id){
  e.stopPropagation();
  const ch=journeyData.chapters.find(c=>c.id===id);
  showModal('删除章节',`<div style="font-size:13px;color:var(--ink3);line-height:1.8;">确定删除「${ch?.title}」？<br>该章节下的所有关卡也会被删除。</div>`,
    ()=>{ journeyData.chapters=journeyData.chapters.filter(c=>c.id!==id); journeyData.lessons=journeyData.lessons.filter(l=>l.chapterId!==id); if(journeyData.lessons.find(l=>l.id===currentLessonId)===undefined)currentLessonId=null; renderSidebar(); renderEditor(); closeModal(); });
}

/* ── 关卡管理 ── */
function addLesson(chapterId){
  const id='lesson_'+Date.now();
  journeyData.lessons.push({id,chapterId,name:'新关卡',icon:'📖',desc:'关卡简介',teaches:[{icon:'📖',title:'教学标题',body:'教学内容…',showBagua:false}],quizzes:[{type:'simple',q:'题目',answer:'答案A',opts:['答案A','选项B','选项C','选项D']}]});
  selectLesson(id);
}

function deleteLesson(e,id){
  e.stopPropagation();
  const l=journeyData.lessons.find(x=>x.id===id);
  showModal('删除关卡',`<div style="font-size:13px;color:var(--ink3);">确定删除关卡「${l?.name}」？</div>`,
    ()=>{ journeyData.lessons=journeyData.lessons.filter(x=>x.id!==id); if(currentLessonId===id)currentLessonId=null; renderSidebar(); renderEditor(); closeModal(); });
}

/* ── 保存 ── */
async function saveAll(){
  const btn=document.getElementById('save-btn');
  const txt=document.getElementById('save-btn-text');
  const status=document.getElementById('save-status');
  btn.classList.add('saving'); txt.textContent='保存中…';
  const ok=await cosPut(COS_KEY, journeyData);
  btn.classList.remove('saving');
  if(ok){ txt.textContent='保存到 COS'; status.textContent='✓ 已保存 '+new Date().toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'}); showToast('保存成功！'); }
  else{ txt.textContent='保存到 COS'; status.textContent='✗ 保存失败，请重试'; showToast('保存失败，请检查网络'); }
}

/* ── 弹窗 ── */
function showModal(title, body, onConfirm){
  document.getElementById('modal-title').textContent=title;
  document.getElementById('modal-body').innerHTML=body;
  document.getElementById('modal-confirm').onclick=onConfirm;
  document.getElementById('modal').classList.add('show');
  setTimeout(()=>{ const inp=document.getElementById('m-input'); if(inp){inp.focus();inp.select();} },100);
}
function closeModal(e){ if(!e||e.target===document.getElementById('modal')) document.getElementById('modal').classList.remove('show'); }

/* ── Toast ── */
let toastTimer;
function showToast(msg){ const el=document.getElementById('toast'); el.textContent=msg; el.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.classList.remove('show'),2500); }

/* ── 工具 ── */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── 初始化 ── */
init();
</script>
