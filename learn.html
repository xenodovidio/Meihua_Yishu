<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>梅花易数 · 习卦 v1.13</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;700&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1a1410;--ink2:#3d3328;--ink3:#7a6e63;--ink4:#b0a89e;
  --paper:#f5f0e8;--paper2:#ede7d8;--paper3:#e0d8c8;
  --gold:#b8912a;--gold2:#d4aa4a;--red:#8b2020;--jade:#2d6e5a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 12% 15%,rgba(184,145,42,.07) 0%,transparent 45%),radial-gradient(ellipse at 88% 85%,rgba(139,32,32,.05) 0%,transparent 45%);pointer-events:none;z-index:0;}

/* ── Header ── */
.header{padding:16px 24px;padding-top:calc(16px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--paper3);display:flex;align-items:center;justify-content:space-between;background:rgba(245,240,232,.96);position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(8px);}
.header-left{display:flex;align-items:center;gap:10px;}
.back-btn{background:none;border:1px solid var(--paper3);border-radius:6px;padding:6px 12px;font-family:'Noto Sans SC',sans-serif;font-size:12px;color:var(--ink3);cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;}
.back-btn:hover{border-color:var(--gold2);color:var(--gold);}
.header-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;color:var(--ink);letter-spacing:.12em;}
.header-score{font-size:12px;color:var(--ink4);display:flex;align-items:center;gap:6px;}
.score-val{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--gold);font-weight:500;}

/* ── 主体 ── */
.main{max-width:520px;margin:0 auto;padding:calc(70px + env(safe-area-inset-top,0px)) 20px calc(40px + env(safe-area-inset-bottom,0px));}

/* ── 模式选择 ── */
.mode-view{display:flex;flex-direction:column;gap:14px;}
.mode-header{font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;color:var(--ink);margin:20px 0 6px;letter-spacing:.06em;}
.mode-sub{font-size:13px;color:var(--ink3);line-height:1.9;margin-bottom:8px;}
.mode-card{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:20px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:16px;}
.mode-card:hover{border-color:var(--gold2);background:rgba(184,145,42,.06);transform:translateY(-1px);}
.mode-icon{font-size:28px;width:52px;height:52px;background:rgba(245,240,232,.9);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--paper3);}
.mode-info{flex:1;}
.mode-name{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:var(--ink);margin-bottom:4px;}
.mode-desc{font-size:12px;color:var(--ink3);line-height:1.7;}
.mode-badge{font-size:11px;padding:2px 9px;border-radius:20px;background:rgba(184,145,42,.1);color:var(--gold);border:1px solid rgba(184,145,42,.25);flex-shrink:0;}
.mode-badge.hard{background:rgba(139,32,32,.07);color:var(--red);border-color:rgba(139,32,32,.2);}
.mode-badge.mid{background:rgba(45,110,90,.08);color:var(--jade);border-color:rgba(45,110,90,.25);}

/* ── 进度条 ── */
.progress-bar-wrap{margin-bottom:20px;}
.progress-info{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
.progress-label{font-size:12px;color:var(--ink4);}
.progress-count{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink3);}
.progress-bar{height:4px;background:var(--paper3);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:2px;transition:width .4s ease;}

/* ── 题目卡片 ── */
.quiz-view{display:none;flex-direction:column;gap:16px;}
.quiz-view.active{display:flex;}
.quiz-type-badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 12px;border-radius:20px;background:rgba(184,145,42,.1);color:var(--gold);border:1px solid rgba(184,145,42,.25);margin-bottom:4px;width:fit-content;}
.quiz-question{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:22px;}
.quiz-q-label{font-size:11px;color:var(--ink4);letter-spacing:.1em;margin-bottom:12px;}
.quiz-gua-display{display:flex;justify-content:center;gap:32px;margin:16px 0;}
.quiz-gua-item{display:flex;flex-direction:column;align-items:center;gap:6px;}
.quiz-gua-label{font-size:11px;color:var(--ink4);}

/* 爻线 */
.yao-lines{display:flex;flex-direction:column-reverse;gap:5px;align-items:center;}
.yao-row{display:flex;align-items:center;gap:4px;}
.yao-num{font-size:9px;color:var(--ink4);width:10px;text-align:right;font-family:'Noto Serif SC',serif;}
.yao-line{height:6px;border-radius:3px;}
.yang{width:50px;background:var(--ink2);}
.yin{width:50px;display:flex;gap:7px;background:transparent;}
.yin::before,.yin::after{content:'';display:block;height:6px;flex:1;background:var(--ink2);border-radius:3px;}
.dong.yang{background:var(--red);box-shadow:0 0 5px rgba(139,32,32,.3);}
.dong.yin::before,.dong.yin::after{background:var(--red);}
.dong-mark{font-size:9px;color:var(--red);}

.quiz-gua-name{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;color:var(--ink);}
.quiz-gua-attr{font-size:11px;color:var(--ink4);}
.quiz-question-text{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--ink2);line-height:1.9;margin-top:10px;}
.quiz-hint{font-size:12px;color:var(--ink4);margin-top:8px;line-height:1.7;padding:8px 12px;background:rgba(245,240,232,.7);border-radius:6px;}

/* ── 选项 ── */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.options-grid.single{grid-template-columns:1fr;}
.option-btn{background:rgba(237,231,216,.5);border:1px solid var(--paper3);border-radius:10px;padding:14px 16px;font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink2);cursor:pointer;transition:all .2s;text-align:center;line-height:1.6;display:flex;flex-direction:column;align-items:center;gap:4px;}
.option-btn:hover:not(:disabled){border-color:var(--gold2);background:rgba(184,145,42,.06);}
.option-btn.correct{border-color:var(--jade);background:rgba(45,110,90,.08);color:var(--jade);}
.option-btn.wrong{border-color:var(--red);background:rgba(139,32,32,.06);color:var(--red);}
.option-btn.reveal{border-color:var(--jade);background:rgba(45,110,90,.05);}
.option-btn:disabled{cursor:default;}
.option-sub{font-size:11px;color:var(--ink4);}
.option-btn.correct .option-sub{color:var(--jade);}
.option-btn.wrong .option-sub{color:var(--red);}

/* ── 解析 ── */
.explain-card{background:rgba(237,231,216,.5);border:1px solid var(--paper3);border-radius:10px;padding:18px;animation:fadeUp .3s ease;display:none;}
.explain-card.show{display:block;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.explain-result{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.result-icon{font-size:20px;}
.result-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;}
.result-text.correct{color:var(--jade);}
.result-text.wrong{color:var(--red);}
.explain-body{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink2);line-height:2.2;border-left:3px solid var(--gold2);padding-left:12px;}

/* ── 底部按钮 ── */
.quiz-actions{display:flex;gap:10px;}
.next-btn{flex:1;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:14px;font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;cursor:pointer;letter-spacing:.15em;transition:all .2s;display:none;}
.next-btn.show{display:block;}
.next-btn:hover{background:var(--ink2);}
.quit-btn{background:none;border:1px solid var(--paper3);border-radius:8px;padding:14px 18px;font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--ink4);cursor:pointer;transition:all .2s;}
.quit-btn:hover{border-color:var(--ink4);color:var(--ink3);}

/* ── 结算页 ── */
.result-view{display:none;flex-direction:column;align-items:center;gap:20px;padding:20px 0;}
.result-view.active{display:flex;}
.result-circle{width:120px;height:120px;border-radius:50%;border:3px solid var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(184,145,42,.06);}
.result-big{font-family:'Noto Serif SC',serif;font-size:36px;font-weight:700;color:var(--gold);}
.result-of{font-size:12px;color:var(--ink4);margin-top:2px;}
.result-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--ink);}
.result-desc{font-size:13px;color:var(--ink3);line-height:1.9;text-align:center;max-width:280px;}
.result-stars{font-size:24px;letter-spacing:4px;}
.result-btns{display:flex;gap:10px;width:100%;}
.result-btn{flex:1;border-radius:8px;padding:13px;font-family:'Noto Serif SC',serif;font-size:14px;cursor:pointer;transition:all .2s;letter-spacing:.08em;}
.result-btn.primary{background:var(--ink);color:var(--paper);border:none;}
.result-btn.primary:hover{background:var(--ink2);}
.result-btn.secondary{background:none;border:1px solid var(--paper3);color:var(--ink3);}
.result-btn.secondary:hover{border-color:var(--ink3);}

/* ── 连击提示 ── */
.combo-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--gold);color:var(--paper);font-family:'Noto Serif SC',serif;font-size:13px;padding:6px 18px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:100;white-space:nowrap;}
.combo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

<script>
/* ─── 状态 ─── */
let currentMode='';
let questions=[];
let currentIdx=0;
let correctCount=0;
let combo=0;
let totalScore=parseInt(localStorage.getItem('learn_score')||'0');
let comboTimer=null;

document.getElementById('total-score').textContent=totalScore;

/* ─── 爻线渲染 ─── */
function yaoLines(uL,dL,dongIdx,size=1){
  const all=[...dL,...uL];
  const w=size===1?50:38;
  const gap=size===1?7:5;
  return`<div class="yao-lines" style="gap:${size===1?5:4}px">${all.map((l,i)=>{
    const isDong=i===dongIdx;
    if(l==='y') return`<div class="yao-row"><div class="yao-line yang${isDong?' dong':''}" style="width:${w}px"></div>${isDong?'<div class="dong-mark">●</div>':'<div style="width:10px"></div>'}</div>`;
    return`<div class="yao-row"><div class="yao-line yin${isDong?' dong':''}" style="width:${w}px"></div>${isDong?'<div class="dong-mark">●</div>':'<div style="width:10px"></div>'}</div>`;
  }).join('')}</div>`;
}

/* ─── 万物类象数据 ─── */
const BAGUA_XIANG={
  1:{name:'乾',xiang:{自然:['天','太阳','冰雹','西北风'],人物:['父亲','君王','老人','领导','男性长辈'],身体:['头','骨骼','肺','大肠'],动物:['马','龙','狮子','象'],器物:['金属器具','圆形器物','钟表','镜子','帽子'],场所:['天空','宫殿','政府机关'],特性:['刚健','圆形','坚硬'],方位:['西北']}},
  2:{name:'兑',xiang:{自然:['湖泊','沼泽','雨水','秋天'],人物:['少女','歌手','演员','律师'],身体:['口','舌','牙齿','咽喉'],动物:['羊','兔','水鸟'],器物:['刀剪','乐器','饮食器具'],场所:['湖边','沼泽地','娱乐场所'],特性:['喜悦','缺口','口才好'],方位:['西']}},
  3:{name:'离',xiang:{自然:['太阳','火','闪电','夏天','彩虹'],人物:['中女','文人','美女'],身体:['眼睛','心脏','血液'],动物:['雉（野鸡）','龟','蟹'],器物:['灯具','电器','书籍','文件'],场所:['南方','图书馆','电视台'],特性:['光明','美丽','中空'],方位:['南']}},
  4:{name:'震',xiang:{自然:['雷','地震','春天'],人物:['长男','军人','运动员'],身体:['足','肝','胆'],动物:['龙','蛇','鹰'],器物:['乐器','鼓','车辆','电话'],场所:['森林','马路','车站'],特性:['震动','突发','声音大'],方位:['东']}},
  5:{name:'巽',xiang:{自然:['风','空气','木材'],人物:['长女','商人','旅行者'],身体:['股（大腿）','气管','神经'],动物:['鸡','蛇','蜈蚣'],器物:['绳索','纸张','通讯工具','飞机'],场所:['花园','机场','市场'],特性:['柔顺','细长','弯曲'],方位:['东南']}},
  6:{name:'坎',xiang:{自然:['水','雨','河流','冬天','月亮'],人物:['中男','盗贼','渔夫'],身体:['耳','肾','膀胱','脊椎'],动物:['猪','鱼','水中生物'],器物:['水桶','酒瓶','轮胎'],场所:['水边','地下室','暗处','井'],特性:['险陷','弯曲','流动','黑暗'],方位:['北']}},
  7:{name:'艮',xiang:{自然:['山','丘陵','土地'],人物:['少男','僧侣','守卫'],身体:['手','背','鼻','脾','胃'],动物:['狗','牛','鼠','虎'],器物:['石头','砖瓦','家具','门'],场所:['山地','仓库','厕所'],特性:['静止','厚重','阻隔'],方位:['东北']}},
  8:{name:'坤',xiang:{自然:['大地','土壤','平原'],人物:['母亲','老女性','农民'],身体:['腹部','脾','胃','肉'],动物:['牛','蚂蚁','蚯蚓'],器物:['布匹','方形器物','陶器'],场所:['平地','田野','农村'],特性:['柔顺','宽厚','众多'],方位:['西南']}},
};

/* ─── 卦→类象题 ─── */
function genXiangFromGuaQ(){
  const n=Math.floor(Math.random()*8)+1;
  const info=BI[n];
  const xiang=BAGUA_XIANG[n].xiang;
  // 随机选一个类别
  const cats=Object.keys(xiang);
  const cat=cats[Math.floor(Math.random()*cats.length)];
  const items=xiang[cat];
  // 正确答案：随机取一个类象
  const correct=items[Math.floor(Math.random()*items.length)];
  // 错误选项：从其他卦的同类别里取，或随机类别
  const wrongPool=[];
  Object.entries(BAGUA_XIANG).forEach(([k,v])=>{
    if(Number(k)!==n){
      const w=v.xiang[cat]||Object.values(v.xiang).flat();
      wrongPool.push(...w);
    }
  });
  const wrongs=shuffle([...new Set(wrongPool)].filter(x=>!items.includes(x))).slice(0,3);
  const opts=shuffle([correct,...wrongs]);
  return{
    type:'xiang_from_gua',
    guaNum:n,
    lines:BL[n],
    cat,
    answer:correct,
    options:opts.map(o=>({val:o,label:o})),
    explain:`${info.name}卦（${info.attr}·${info.wx}）在"${cat}"类象中包含：${items.join('、')}等。`,
  };
}

/* ─── 类象→卦题 ─── */
function genGuaFromXiangQ(){
  const n=Math.floor(Math.random()*8)+1;
  const info=BI[n];
  const xiang=BAGUA_XIANG[n].xiang;
  const cats=Object.keys(xiang);
  const cat=cats[Math.floor(Math.random()*cats.length)];
  const items=xiang[cat];
  const item=items[Math.floor(Math.random()*items.length)];
  // 错误选项：其他3个卦
  const others=Object.keys(BI).map(Number).filter(k=>k!==n);
  shuffle(others);
  const wrongs=others.slice(0,3);
  const opts=shuffle([n,...wrongs]);
  return{
    type:'gua_from_xiang',
    item,cat,
    options:opts.map(k=>({val:String(k),label:BI[k].name,sub:`${BI[k].attr}·${BI[k].wx}`})),
    explain:`"${item}"属于${info.name}卦（${info.attr}·${info.wx}）的"${cat}"类象。${info.name}卦还包含：${items.filter(x=>x!==item).slice(0,3).join('、')}等。`,
    answer:String(n),
  };
}

/* ─── 题目生成 ─── */
function genRecognizeQ(){
  // 随机选一个卦
  const n=Math.floor(Math.random()*8)+1;
  const info=BI[n];
  const lines=BL[n];
  // 错误选项
  const others=Object.keys(BI).map(Number).filter(k=>k!==n);
  shuffle(others);
  const wrong=others.slice(0,3);
  const opts=shuffle([n,...wrong]);
  return{
    type:'recognize',
    lines,
    answer:n,
    options:opts.map(k=>({val:k,label:BI[k].name,sub:`${BI[k].attr}·${BI[k].wx}·${BI[k].nat}`})),
    explain:`${info.name}卦，象征"${info.attr}"，五行属${info.wx}，卦性${info.nat}。记忆口诀：乾三连，坤六断，震仰盂，艮覆碗，离中虚，坎中满，兑上缺，巽下断。`
  };
}

function genJixiongQ(){
  const g=GUA64[Math.floor(Math.random()*GUA64.length)];
  const tiN=g.d, yongN=g.u;
  const tiI=BI[tiN],yongI=BI[tiN===g.d?g.u:g.d];
  // 重新确定体用
  const tiInfo=BI[g.d],yongInfo=BI[g.u];
  const tiWx=tiInfo.wx,yongWx=yongInfo.wx;
  let rel='',answer='',explain='';
  if(WX_SHENG[yongWx]===tiWx){rel='用生体';answer='good';explain=`用卦${yongInfo.name}（${yongWx}）生体卦${tiInfo.name}（${tiWx}），用生体，所问之事有贵人相助，较为有利。`;}
  else if(WX_SHENG[tiWx]===yongWx){rel='体生用';answer='bad';explain=`体卦${tiInfo.name}（${tiWx}）生用卦${yongInfo.name}（${yongWx}），体生用，体卦泄气于用卦，付出多收获少，属小凶，不利。`;}
  else if(WX_KE[yongWx]===tiWx){rel='用克体';answer='bad';explain=`用卦${yongInfo.name}（${yongWx}）克体卦${tiInfo.name}（${tiWx}），用克体，所问之事受阻，需谨慎应对。`;}
  else if(WX_KE[tiWx]===yongWx){rel='体克用';answer='good';explain=`体卦${tiInfo.name}（${tiWx}）克用卦${yongInfo.name}（${yongWx}），体克用，主动有力，所问之事可成。`;}
  else{rel='体用比和';answer='mid';explain=`体卦${tiInfo.name}与用卦${yongInfo.name}同属${tiWx}，比和平衡，事情平稳，无大起伏。`;}

  const opts=shuffle([
    {val:'good',label:'有利',sub:'用生体 或 体克用'},
    {val:'bad',label:'不利',sub:'用克体 或 体生用'},
    {val:'mid',label:'平稳',sub:'比和'},
  ]);
  return{
    type:'jixiong',
    g,tiInfo,yongInfo,tiWx,yongWx,rel,
    answer,options:opts,explain
  };
}

/* ─── 工具：爻线数组转八卦编号（初→上顺序，与BL一致）─── */
function lines2num(ls){
  const m={
    'y,y,y':1, // 乾：初阳二阳三阳
    'y,y,n':2, // 兑：初阳二阳三阴
    'y,n,y':3, // 离：初阳二阴三阳
    'y,n,n':4, // 震：初阳二阴三阴
    'n,y,y':5, // 巽：初阴二阳三阳
    'n,y,n':6, // 坎：初阴二阳三阴
    'n,n,y':7, // 艮：初阴二阴三阳
    'n,n,n':8, // 坤：初阴二阴三阴
  };
  return m[ls.join(',')]||1;
}

/* ─── 猜互卦题 ─── */
function genHuGuaQ(){
  const g=GUA64[Math.floor(Math.random()*GUA64.length)];
  // BL已经是初→上顺序，直接拼接
  const all=[...BL[g.d],...BL[g.u]];
  // 互卦：index 1,2,3为下互；index 2,3,4为上互
  const huDL=[all[1],all[2],all[3]];
  const huUL=[all[2],all[3],all[4]];
  const huD=lines2num(huDL);
  const huU=lines2num(huUL);
  const huInfo=GUA64.find(x=>x.u===huU&&x.d===huD);
  const huName=huInfo?huInfo.n:'未知卦';
  const others=GUA64.filter(x=>!(x.u===huU&&x.d===huD));
  shuffle(others);
  const wrongs=others.slice(0,3).map(x=>x.n);
  const opts=shuffle([huName,...wrongs]);
  return{
    type:'hugua',
    benGua:g,
    all,huD,huU,
    answer:huName,
    options:opts.map(o=>({val:o,label:o})),
    explain:`互卦取本卦第2、3、4爻组成下互卦（${BI[huD].name}），第3、4、5爻组成上互卦（${BI[huU].name}），合为${huName}。`,
  };
}

/* ─── 猜变卦题 ─── */
function genBianGuaQ(){
  const g=GUA64[Math.floor(Math.random()*GUA64.length)];
  const all=[...BL[g.d],...BL[g.u]];
  const dong=Math.floor(Math.random()*6);
  const bAll=all.map((l,i)=>i===dong?(l==='y'?'n':'y'):l);
  // 下卦=index 0-2，上卦=index 3-5，BL是初→上所以需要reverse给lines2num
  const bDL=bAll.slice(0,3);
  const bUL=bAll.slice(3);
  const bD=lines2num(bDL);
  const bU=lines2num(bUL);
  const bianInfo=GUA64.find(x=>x.u===bU&&x.d===bD);
  const bianName=bianInfo?bianInfo.n:'未知卦';
  const dongNames=['初','二','三','四','五','上'];
  const others=GUA64.filter(x=>!(x.u===bU&&x.d===bD));
  shuffle(others);
  const wrongs=others.slice(0,3).map(x=>x.n);
  const opts=shuffle([bianName,...wrongs]);
  return{
    type:'biangua',
    benGua:g,
    all,dong,bAll,bD,bU,
    answer:bianName,
    options:opts.map(o=>({val:o,label:o})),
    explain:`第${dongNames[dong]}爻为动爻，${all[dong]==='y'?'阳爻变阴爻':'阴爻变阳爻'}，上卦变为${BI[bU].name}，下卦变为${BI[bD].name}，合为变卦${bianName}。`,
  };
}

function genQuestions(mode,count=10){
  const qs=[];
  for(let i=0;i<count;i++){
    if(mode==='recognize'){
      const r=Math.random();
      if(r<0.25)qs.push(genRecognizeQ());
      else if(r<0.50)qs.push(genHuGuaQ());
      else if(r<0.75)qs.push(genBianGuaQ());
      else qs.push(Math.random()<0.5?genXiangFromGuaQ():genGuaFromXiangQ());
    }
    else if(mode==='xiang'){
      qs.push(Math.random()<0.5?genXiangFromGuaQ():genGuaFromXiangQ());
    }
    else if(mode==='tiyong')qs.push(genTiyongQ());
    else qs.push(genJixiongQ());
  }
  return qs;
}

/* ─── 开始模式 ─── */
function startMode(mode){
  try{
    currentMode=mode;
    questions=genQuestions(mode,10);
    currentIdx=0;
    correctCount=0;
    combo=0;
    document.getElementById('mode-view').style.display='none';
    document.getElementById('result-view').classList.remove('active');
    document.getElementById('quiz-view').classList.add('active');
    const labels={recognize:'识卦练习',tiyong:'体用判断',jixiong:'吉凶判断',xiang:'万物类象'};
    document.getElementById('mode-label').textContent=labels[mode];
    document.getElementById('q-total').textContent=questions.length;
    renderQuestion();
  }catch(e){
    alert('启动失败：'+e.message);
    console.error(e);
  }
}

/* ─── 渲染题目 ─── */
function renderQuestion(){
  const q=questions[currentIdx];
  const idx=currentIdx;
  document.getElementById('q-current').textContent=idx+1;
  document.getElementById('progress-fill').style.width=`${((idx+1)/questions.length)*100}%`;
  document.getElementById('explain-card').classList.remove('show');
  document.getElementById('next-btn').classList.remove('show');

  const qEl=document.getElementById('quiz-question');
  const optsEl=document.getElementById('options-grid');

  if(q.type==='recognize'){
    const lines=q.lines;
    const linesHtml=lines.map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}" style="width:50px"></div><div style="width:10px"></div></div>`).join('');
    qEl.innerHTML=`
      <div class="quiz-q-label">看爻线，选出对应的卦名</div>
      <div class="quiz-gua-display">
        <div class="quiz-gua-item">
          <div class="yao-lines" style="gap:5px">${linesHtml}</div>
        </div>
      </div>
      <div class="quiz-hint">提示：从下往上数，阳爻（实线）= 奇数，阴爻（断线）= 偶数</div>
    `;
    optsEl.className='options-grid';
    optsEl.innerHTML=q.options.map(o=>`
      <button class="option-btn" onclick="selectAnswer('${o.val}','${q.answer}')">
        <span>${o.label}</span>
        <span class="option-sub">${o.sub}</span>
      </button>
    `).join('');
  }

  else if(q.type==='hugua'||q.type==='biangua'){
    const {benGua,all,dong}=q;
    const dongNames=['初','二','三','四','五','上'];
    const isHu=q.type==='hugua';
    // all是初→上，yao-lines用column-reverse，所以直接传入即可正确显示上→下
    const linesHtml=all.map((l,i)=>{
      const isDong=!isHu&&i===dong;
      const cls=`yao-line ${l==='y'?'yang':'yin'}${isDong?' dong':''}`;
      return`<div class="yao-row">
        <div class="yao-num" style="width:14px;text-align:right;font-size:10px;color:var(--ink4);font-family:'Noto Serif SC',serif;">${dongNames[i]}</div>
        <div class="${cls}" style="width:50px"></div>
        ${isDong?'<div class="dong-mark">●</div>':'<div style="width:10px"></div>'}
      </div>`;
    }).join('');
    qEl.innerHTML=`
      <div class="quiz-q-label">${isHu?'看本卦，选出互卦':'看本卦和动爻，选出变卦'}</div>
      <div class="quiz-gua-display">
        <div class="quiz-gua-item">
          <div class="quiz-gua-label">本卦：${benGua.n}</div>
          <div class="yao-lines" style="gap:5px;margin-top:8px;">${linesHtml}</div>
        </div>
      </div>
      <div class="quiz-hint">${isHu?'互卦：取第2、3、4爻为下卦，第3、4、5爻为上卦':`第${dongNames[dong]}爻为动爻（红色），阴阳互换后得变卦`}</div>
    `;
    optsEl.className='options-grid';
    optsEl.innerHTML=q.options.map(o=>`
      <button class="option-btn" onclick="selectAnswer('${o.val}','${q.answer}')">
        <span>${o.label}</span>
      </button>
    `).join('');
  }

  else if(q.type==='xiang_from_gua'){
    const linesHtml=q.lines.map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}" style="width:44px"></div><div style="width:10px"></div></div>`).join('');
    qEl.innerHTML=`
      <div class="quiz-q-label">看卦象，选出对应的${q.cat}类象</div>
      <div class="quiz-gua-display">
        <div class="quiz-gua-item">
          <div class="yao-lines" style="gap:5px">${linesHtml}</div>
          <div class="quiz-gua-name">${BI[q.guaNum].name}</div>
          <div class="quiz-gua-attr">${BI[q.guaNum].attr}·${BI[q.guaNum].wx}</div>
        </div>
      </div>
      <div class="quiz-hint">从以下选项中选出属于此卦「${q.cat}」的类象</div>
    `;
    optsEl.className='options-grid';
    optsEl.innerHTML=q.options.map(o=>`
      <button class="option-btn" data-val="${o.val.replace(/"/g,'&quot;')}" onclick="selectTiyongAnswer(this)">
        <span>${o.label}</span>
      </button>
    `).join('');
  }

  else if(q.type==='gua_from_xiang'){
    qEl.innerHTML=`
      <div class="quiz-q-label">根据类象，选出对应的卦</div>
      <div class="quiz-question-text" style="font-size:18px;text-align:center;padding:16px 0;font-weight:500;">「${q.item}」</div>
      <div class="quiz-hint">以上事物属于哪个卦的「${q.cat}」类象？</div>
    `;
    optsEl.className='options-grid';
    optsEl.innerHTML=q.options.map(o=>`
      <button class="option-btn" data-val="${o.val}" onclick="selectTiyongAnswer(this)">
        <span>${o.label}</span>
        <span class="option-sub">${o.sub}</span>
      </button>
    `).join('');
  }

  else if(q.type==='tiyong'){
    const {qText}=q;
    qEl.innerHTML=`
      <div class="quiz-q-label">判断体用关系</div>
      <div class="quiz-question-text" style="font-size:15px;line-height:2;margin-top:8px;">${qText}</div>
      <div class="quiz-hint" style="margin-top:12px;">核心原则：以不动的为体，动的为用</div>
    `;
    optsEl.className='options-grid single';
    optsEl.innerHTML=q.options.map(o=>`
      <button class="option-btn" data-val="${o.label.replace(/"/g,'&quot;')}" onclick="selectTiyongAnswer(this)">
        <span>${o.label}</span>
      </button>
    `).join('');
  }

  else if(q.type==='jixiong'){
    const {g,tiInfo,yongInfo,tiWx,yongWx,rel}=q;
    qEl.innerHTML=`
      <div class="quiz-q-label">判断吉凶走向</div>
      <div class="quiz-gua-display">
        <div class="quiz-gua-item">
          <div class="quiz-gua-label">体卦（主）</div>
          <div class="yao-lines" style="gap:5px">
            ${BL[g.d].map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}" style="width:44px"></div></div>`).join('')}
          </div>
          <div class="quiz-gua-name">${tiInfo.name}</div>
          <div class="quiz-gua-attr">${tiInfo.attr}·${tiWx}</div>
        </div>
        <div style="font-size:18px;color:var(--ink4);align-self:center;padding-bottom:20px;">⇌</div>
        <div class="quiz-gua-item">
          <div class="quiz-gua-label">用卦（客）</div>
          <div class="yao-lines" style="gap:5px">
            ${BL[g.u].map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}" style="width:44px"></div></div>`).join('')}
          </div>
          <div class="quiz-gua-name">${yongInfo.name}</div>
          <div class="quiz-gua-attr">${yongInfo.attr}·${yongWx}</div>
        </div>
      </div>
      <div class="quiz-question-text">五行关系：<strong>${tiWx} vs ${yongWx}</strong></div>
      <div class="quiz-hint">用生体/体克用→有利，用克体/体生用→不利，比和→平稳</div>
    `;
    optsEl.className='options-grid';
    optsEl.innerHTML=q.options.map(o=>`
      <button class="option-btn" onclick="selectAnswer('${o.val}','${q.answer}')">
        <span>${o.label}</span>
        <span class="option-sub">${o.sub}</span>
      </button>
    `).join('');
  }
}

function selectTiyongAnswer(btn){
  const val=btn.getAttribute('data-val');
  const q=questions[currentIdx];
  selectAnswer(val, q.answer);
}

/* ─── 选择答案 ─── */
function selectAnswer(val,answer){
  const btns=document.querySelectorAll('.option-btn');
  btns.forEach(b=>b.disabled=true);

  const isCorrect=val===answer;
  btns.forEach(b=>{
    // 支持 data-val（体用题）和 onclick（其他题）两种方式
    const bVal=b.getAttribute('data-val')||
      (b.getAttribute('onclick')||'').match(/'([^']+)'/)?.[1]||'';
    if(bVal===answer)b.classList.add(isCorrect?'correct':'reveal');
    else if(bVal===val&&!isCorrect)b.classList.add('wrong');
  });

  const q=questions[currentIdx];
  const explainEl=document.getElementById('explain-card');

  if(isCorrect){
    correctCount++;
    combo++;
    const pts=combo>=3?20:combo>=2?15:10;
    totalScore+=pts;
    localStorage.setItem('learn_score',totalScore);
    document.getElementById('total-score').textContent=totalScore;
    if(combo>=2)showCombo(combo,pts);
    explainEl.innerHTML=`
      <div class="explain-result"><span class="result-icon">✓</span><span class="result-text correct">回答正确 +${pts}分</span></div>
      <div class="explain-body">${q.explain}</div>
    `;
  } else {
    combo=0;
    explainEl.innerHTML=`
      <div class="explain-result"><span class="result-icon">✗</span><span class="result-text wrong">回答错误</span></div>
      <div class="explain-body">${q.explain}</div>
    `;
  }

  explainEl.classList.add('show');
  document.getElementById('next-btn').classList.add('show');
  document.getElementById('next-btn').textContent=currentIdx===questions.length-1?'查看结果 →':'下一题 →';
}

/* ─── 下一题 ─── */
function nextQuestion(){
  currentIdx++;
  if(currentIdx>=questions.length){
    showResult();
  } else {
    renderQuestion();
  }
}

/* ─── 结算 ─── */
function showResult(){
  document.getElementById('quiz-view').classList.remove('active');
  const rv=document.getElementById('result-view');
  rv.classList.add('active');
  const pct=Math.round((correctCount/questions.length)*100);
  const stars=pct>=90?'★★★':pct>=70?'★★☆':'★☆☆';
  const titles={recognize:'识卦练习',tiyong:'体用判断',jixiong:'吉凶判断'};
  const comments=pct>=90?'卦理精通，令人叹服！':pct>=70?'掌握扎实，继续精进。':pct>=50?'初有所得，多加练习。':'尚需努力，温故知新。';
  rv.innerHTML=`
    <div class="result-circle">
      <div class="result-big">${correctCount}</div>
      <div class="result-of">/ ${questions.length} 题</div>
    </div>
    <div class="result-stars">${stars}</div>
    <div class="result-title">${titles[currentMode]}完成</div>
    <div class="result-desc">${comments}<br>正确率 ${pct}%</div>
    <div class="result-btns">
      <button class="result-btn secondary" onclick="showModes()">返回选择</button>
      <button class="result-btn primary" onclick="startMode('${currentMode}')">再来一轮</button>
    </div>
  `;
}

/* ─── 工具 ─── */
function showModes(){
  document.getElementById('result-view').classList.remove('active');
  document.getElementById('quiz-view').classList.remove('active');
  document.getElementById('mode-view').style.display='flex';
}

function quitQuiz(){
  document.getElementById('quiz-view').classList.remove('active');
  document.getElementById('mode-view').style.display='flex';
}

function showCombo(n,pts){
  const el=document.getElementById('combo-toast');
  el.textContent=`连击 ${n}× · +${pts}分`;
  el.classList.add('show');
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>el.classList.remove('show'),1800);
}

function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
