<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/500.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/700.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.css" media="print" onload="this.media='all'">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>梅花易数 · 习卦 v1.45</title>
<style>
:root{
  --ink:#1a1410;--ink2:#3d3328;--ink3:#7a6e63;--ink4:#b0a89e;
  --paper:#f5f0e8;--paper2:#ede7d8;--paper3:#e0d8c8;
  --gold:#b8912a;--gold2:#d4aa4a;--red:#8b2020;--jade:#2d6e5a;
  --jade2:#3d8a6e;--blue:#2563eb;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Noto Sans SC',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 12% 15%,rgba(184,145,42,.07) 0%,transparent 45%),radial-gradient(ellipse at 88% 85%,rgba(139,32,32,.05) 0%,transparent 45%);pointer-events:none;z-index:0;}

/* ── Header ── */
.header{padding:14px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));border-bottom:1px solid var(--paper3);display:flex;align-items:center;justify-content:space-between;background:rgba(245,240,232,.96);position:fixed;top:0;left:0;right:0;z-index:50;backdrop-filter:blur(8px);}
.header-left{display:flex;align-items:center;gap:10px;}
.back-btn{background:none;border:1px solid var(--paper3);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--ink3);cursor:pointer;transition:all .2s;display:none;align-items:center;}
.back-btn.show{display:inline-flex;}
.header-title{font-family:'Noto Serif SC',serif;font-size:18px;font-weight:700;color:var(--ink);}
.header-score{font-size:12px;color:var(--ink4);display:flex;align-items:center;gap:4px;}
.score-val{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--gold);font-weight:500;}

/* ── 主体 ── */
.main{max-width:520px;margin:0 auto;padding:calc(68px + env(safe-area-inset-top,0px)) 20px calc(90px + env(safe-area-inset-bottom,0px));}
.view{display:none;}.view.active{display:block;}

/* ── 智能学习设置弹窗 ── */
.study-settings-btn{background:none;border:1px solid var(--paper3);border-radius:6px;padding:4px 8px;font-size:13px;color:var(--ink3);cursor:pointer;transition:all .2s;display:none;align-items:center;}
.study-settings-btn.show{display:flex;}
.study-settings-btn:hover{border-color:var(--gold2);color:var(--gold);}
.settings-overlay{display:none;position:fixed;inset:0;background:rgba(26,20,16,.5);z-index:200;align-items:center;justify-content:center;padding:20px;}
.settings-overlay.show{display:flex;}
.settings-panel{background:var(--paper);border-radius:14px;padding:24px 20px;width:100%;max-width:380px;}
.settings-title{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;color:var(--ink);margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.settings-close{background:none;border:none;font-size:20px;color:var(--ink4);cursor:pointer;padding:0 4px;}
.settings-section{margin-bottom:18px;}
.settings-label{font-size:12px;color:var(--ink4);letter-spacing:.1em;margin-bottom:10px;}
.settings-chips{display:flex;flex-wrap:wrap;gap:8px;}
.chip{padding:7px 14px;border-radius:20px;border:1px solid var(--paper3);background:rgba(237,231,216,.6);font-size:13px;color:var(--ink3);cursor:pointer;transition:all .2s;font-family:'Noto Sans SC',sans-serif;}
.chip.active{border-color:var(--gold);background:rgba(184,145,42,.1);color:var(--gold);}
.settings-count{display:flex;align-items:center;gap:14px;}
.settings-count-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--paper3);background:none;font-size:18px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;}
.settings-count-val{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:var(--ink);min-width:30px;text-align:center;}
.settings-start-btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:14px;font-family:'Noto Serif SC',serif;font-size:15px;cursor:pointer;margin-top:4px;letter-spacing:.1em;}
.study-home{display:flex;flex-direction:column;gap:14px;}
.study-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--ink);margin:8px 0 2px;}
.study-sub{font-size:13px;color:var(--ink3);line-height:1.8;margin-bottom:4px;}
.mode-card{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:18px 20px;cursor:pointer;transition:all .25s;display:flex;align-items:center;gap:16px;}
.mode-card:hover{border-color:var(--gold2);background:rgba(184,145,42,.06);transform:translateY(-1px);}
.mode-card.featured{border-color:var(--gold);background:rgba(184,145,42,.07);}
.mode-icon{font-size:26px;width:48px;height:48px;background:rgba(245,240,232,.9);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;border:1px solid var(--paper3);}
.mode-info{flex:1;}
.mode-name{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:3px;}
.mode-desc{font-size:12px;color:var(--ink3);line-height:1.6;}
.mode-badge{font-size:11px;padding:2px 9px;border-radius:20px;background:rgba(184,145,42,.1);color:var(--gold);border:1px solid rgba(184,145,42,.25);flex-shrink:0;}
.mode-badge.hard{background:rgba(139,32,32,.07);color:var(--red);border-color:rgba(139,32,32,.2);}
.mode-badge.mid{background:rgba(45,110,90,.08);color:var(--jade);border-color:rgba(45,110,90,.25);}
.mode-badge.new{background:rgba(139,32,32,.07);color:var(--red);border-color:rgba(139,32,32,.2);}

/* 题目练习 */
.quiz-wrap{display:flex;flex-direction:column;gap:14px;}
.progress-bar-wrap{background:rgba(237,231,216,.5);border-radius:10px;padding:14px 16px;}
.progress-info{display:flex;justify-content:space-between;margin-bottom:8px;}
.progress-label{font-size:12px;color:var(--ink4);}
.progress-count{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink3);}
.progress-bar{height:5px;background:var(--paper3);border-radius:3px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--jade),var(--jade2));border-radius:3px;transition:width .4s ease;}

.quiz-card{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:20px;animation:fadeUp .3s ease;}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.quiz-q-label{font-size:11px;color:var(--ink4);letter-spacing:.1em;margin-bottom:10px;}
.quiz-question-text{font-family:'Noto Serif SC',serif;font-size:15px;color:var(--ink2);line-height:1.9;}
.quiz-gua-display{display:flex;justify-content:center;gap:32px;margin:14px 0;}
.quiz-gua-item{display:flex;flex-direction:column;align-items:center;gap:6px;}
.quiz-gua-label{font-size:11px;color:var(--ink4);}
.quiz-gua-name{font-family:'Noto Serif SC',serif;font-size:17px;font-weight:700;color:var(--ink);}
.quiz-gua-attr{font-size:11px;color:var(--ink4);}
.quiz-hint{font-size:12px;color:var(--ink4);margin-top:10px;padding:8px 12px;background:rgba(245,240,232,.7);border-radius:6px;line-height:1.7;}

/* 爻线 */
.yao-lines{display:flex;flex-direction:column-reverse;gap:5px;align-items:center;}
.yao-row{display:flex;align-items:center;gap:4px;}
.yao-num{font-size:9px;color:var(--ink4);width:10px;text-align:right;font-family:'Noto Serif SC',serif;}
.yao-line{height:6px;border-radius:3px;}
.yang{width:50px;background:var(--ink2);}
.yin{width:50px;display:flex;gap:7px;background:transparent;}
.yin::before,.yin::after{content:'';display:block;height:6px;flex:1;background:var(--ink2);border-radius:3px;}
.dong.yang{background:var(--red);box-shadow:0 0 5px rgba(139,32,32,.3);}
.dong.yin::before,.dong.yin::after{background:var(--red);}
.dong-mark{font-size:9px;color:var(--red);}

/* 选项 */
.options-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.options-grid.single{grid-template-columns:1fr;}
.option-btn{background:rgba(237,231,216,.5);border:1.5px solid var(--paper3);border-radius:10px;padding:13px 14px;font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink2);cursor:pointer;transition:all .2s;text-align:center;line-height:1.6;display:flex;flex-direction:column;align-items:center;gap:4px;}
.option-btn:hover:not(:disabled){border-color:var(--gold2);background:rgba(184,145,42,.06);}
.option-btn.correct{border-color:var(--jade);background:rgba(45,110,90,.08);color:var(--jade);}
.option-btn.wrong{border-color:var(--red);background:rgba(139,32,32,.06);color:var(--red);}
.option-btn.reveal{border-color:var(--jade);background:rgba(45,110,90,.04);}
.option-btn:disabled{cursor:default;}
.option-sub{font-size:11px;color:var(--ink4);}

/* 解析 */
.explain-card{background:rgba(237,231,216,.5);border:1px solid var(--paper3);border-radius:10px;padding:16px;animation:fadeUp .3s ease;display:none;}
.explain-card.show{display:block;}
.explain-result{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.result-icon{font-size:18px;}
.result-text{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;}
.result-text.correct{color:var(--jade);}
.result-text.wrong{color:var(--red);}
.explain-body{font-family:'Noto Serif SC',serif;font-size:13px;color:var(--ink2);line-height:2.1;border-left:3px solid var(--gold2);padding-left:12px;}
.next-btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:14px;font-family:'Noto Serif SC',serif;font-size:15px;cursor:pointer;transition:all .2s;display:none;margin-top:4px;letter-spacing:.1em;}
.next-btn.show{display:block;}
.next-btn:hover{background:var(--ink2);}
.quit-btn{background:none;border:1px solid var(--paper3);border-radius:8px;padding:14px;font-family:'Noto Sans SC',sans-serif;font-size:13px;color:var(--ink4);cursor:pointer;width:100%;margin-top:4px;}

/* 结算 */
.result-view{display:none;flex-direction:column;align-items:center;gap:18px;padding:20px 0;text-align:center;}
.result-view.active{display:flex;}
.result-circle{width:110px;height:110px;border-radius:50%;border:3px solid var(--gold2);display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(184,145,42,.06);}
.result-big{font-family:'Noto Serif SC',serif;font-size:32px;font-weight:700;color:var(--gold);}
.result-of{font-size:12px;color:var(--ink4);}
.result-stars{font-size:24px;letter-spacing:4px;}
.result-title{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--ink);}
.result-desc{font-size:13px;color:var(--ink3);line-height:1.9;max-width:280px;}
.result-btns{display:flex;gap:10px;width:100%;}
.result-btn{flex:1;border-radius:8px;padding:13px;font-family:'Noto Serif SC',serif;font-size:14px;cursor:pointer;transition:all .2s;}
.result-btn.primary{background:var(--ink);color:var(--paper);border:none;}
.result-btn.secondary{background:none;border:1px solid var(--paper3);color:var(--ink3);}

/* 连击 */
.combo-toast{position:fixed;top:120px;left:50%;transform:translateX(-50%) translateY(-10px);background:var(--gold);color:var(--paper);font-family:'Noto Serif SC',serif;font-size:13px;padding:6px 18px;border-radius:20px;opacity:0;transition:all .3s;pointer-events:none;z-index:100;}
.combo-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ════════════════════
   闪卡 View
════════════════════ */
.flashcard-home{display:flex;flex-direction:column;gap:16px;}
.fc-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:4px;}
.fc-stat{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:10px;padding:12px 8px;text-align:center;}
.fc-stat-num{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--ink);display:block;}
.fc-stat-num.learning{color:var(--gold);}
.fc-stat-num.review{color:var(--blue);}
.fc-stat-num.mastered{color:var(--jade);}
.fc-stat-label{font-size:10px;color:var(--ink4);margin-top:2px;display:block;}
.fc-start-btn{width:100%;background:var(--jade);color:white;border:none;border-radius:12px;padding:16px;font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.1em;}
.fc-start-btn:hover{background:var(--jade2);}
.fc-start-btn:disabled{opacity:.5;cursor:default;}
.fc-cat-grid{display:flex;flex-direction:column;gap:10px;}
.fc-category{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:16px 18px;cursor:pointer;transition:border-color .2s;}
.fc-category:hover{border-color:var(--gold2);}
.fc-cat-name{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--ink);}
.fc-cat-count{font-size:12px;color:var(--ink4);}
.fc-cat-arrow{font-size:18px;color:var(--ink4);transition:transform .2s;}
.fc-card-list{display:flex;flex-direction:column;gap:6px;margin-top:12px;border-top:1px solid var(--paper3);padding-top:12px;}
.fc-card-item{background:rgba(245,240,232,.8);border-radius:8px;padding:10px 12px;}
.fc-card-item-front{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink);}
.fc-card-item-sub{font-size:12px;color:var(--ink4);margin-top:2px;}

/* 闪卡内部Tab */
.fc-tabs{display:flex;gap:0;margin-bottom:20px;}
.fc-tab{background:none;border:none;font-family:'Noto Sans SC',sans-serif;font-size:14px;color:var(--ink4);cursor:pointer;padding:6px 16px 8px;border-bottom:2px solid transparent;transition:all .2s;letter-spacing:.04em;}
.fc-tab.active{color:var(--ink);border-bottom-color:var(--ink);}
.fc-tab:hover{color:var(--ink2);}

/* 闪卡练习 */
.fc-session{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:calc(100vh - 160px);margin-top:-40px;}
.fc-progress{width:100%;display:flex;align-items:center;gap:12px;}
.fc-prog-nums{font-size:12px;color:var(--ink4);white-space:nowrap;}
.fc-prog-bar{flex:1;height:4px;background:var(--paper3);border-radius:2px;overflow:hidden;}
.fc-prog-fill{height:100%;background:linear-gradient(90deg,var(--jade),var(--jade2));border-radius:2px;transition:width .4s;}
.fc-card-wrap{width:100%;perspective:1200px;position:relative;}
.fc-drag-hint{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:12px 16px;pointer-events:none;z-index:10;}.fc-card{width:100%;height:300px;border-radius:16px;cursor:grab;position:relative;transform-style:preserve-3d;transition:transform 1.5s cubic-bezier(.4,0,.2,1),box-shadow .2s;user-select:none;}
.fc-card.flipped{transform:rotateY(180deg);}
.fc-card.dragging{cursor:grabbing;transition:box-shadow .2s;}
.fc-card-front,.fc-card-back{position:absolute;inset:0;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 24px;backface-visibility:hidden;-webkit-backface-visibility:hidden;transition:box-shadow .15s;overflow:hidden;}
/* 反光层 — 独立div */
.fc-card-front::after{display:none;}
.fc-card-back::after{display:none;}
.fc-shine{position:absolute;inset:0;border-radius:16px;background:linear-gradient(105deg,rgba(255,255,255,0) 30%,rgba(255,255,255,.5) 50%,rgba(255,255,255,0) 70%);transform:translateX(-150%);pointer-events:none;z-index:10;transition:none;}
.fc-shine.active{transform:translateX(150%);transition:transform .6s ease-out;}
.fc-card-front{background:rgba(237,231,216,.8);border:1px solid var(--paper3);}
.fc-card-back{background:rgba(45,110,90,.06);border:1px solid rgba(45,110,90,.2);transform:rotateY(180deg);}
.fc-card.glow-bad .fc-card-front,.fc-card.glow-bad .fc-card-back{box-shadow:0 0 0 3px rgba(220,38,38,.6),0 0 40px rgba(220,38,38,.25);}
.fc-card.glow-good .fc-card-front,.fc-card.glow-good .fc-card-back{box-shadow:0 0 0 3px rgba(45,110,90,.7),0 0 40px rgba(45,110,90,.25);}

.fc-drag-label{font-size:12px;font-family:'Noto Sans SC',sans-serif;padding:4px 12px;border-radius:20px;opacity:0;transition:opacity .2s;}
.fc-drag-label.bad{color:#dc2626;background:rgba(220,38,38,.1);}
.fc-drag-label.good{color:var(--jade);background:rgba(45,110,90,.1);}
.fc-drag-label.show{opacity:1;}
.fc-card-label{font-size:11px;color:var(--ink4);letter-spacing:.12em;margin-bottom:16px;}
.fc-card-main{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--ink);text-align:center;line-height:1.4;}
.fc-card-sub{font-size:13px;color:var(--ink3);margin-top:10px;text-align:center;line-height:1.8;}
.fc-card-hint{font-size:12px;color:var(--ink4);margin-top:16px;}
.fc-ratings{display:flex;gap:12px;width:100%;}
.fc-rate-btn{flex:1;border:none;border-radius:12px;padding:14px 8px;font-size:22px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:4px;}
.fc-rate-btn span{font-size:11px;font-family:'Noto Sans SC',sans-serif;}
.fc-rate-bad{background:rgba(239,68,68,.12);color:#dc2626;}
.fc-rate-bad:hover{background:rgba(239,68,68,.2);}
.fc-rate-ok{background:rgba(234,179,8,.12);color:#ca8a04;}
.fc-rate-ok:hover{background:rgba(234,179,8,.2);}
.fc-rate-good{background:rgba(45,110,90,.1);color:var(--jade);}
.fc-rate-good:hover{background:rgba(45,110,90,.18);}
.fc-flip-hint{font-size:12px;color:var(--ink4);text-align:center;}

/* ════════════════════
   测试 View
════════════════════ */
.test-home{display:flex;flex-direction:column;gap:20px;}
.test-section-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.test-section-title::before{content:'';display:block;width:3px;height:16px;background:var(--gold);border-radius:2px;}
.test-config{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:16px;}
.test-row{display:flex;align-items:center;justify-content:space-between;}
.test-row-label{font-size:14px;color:var(--ink2);}
.test-counter{display:flex;align-items:center;gap:12px;}
.test-counter-btn{width:32px;height:32px;border-radius:50%;border:1px solid var(--paper3);background:none;font-size:18px;color:var(--ink3);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.test-counter-btn:hover{border-color:var(--gold2);color:var(--gold);}
.test-counter-val{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:500;color:var(--ink);min-width:32px;text-align:center;}
.test-create-btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:15px;font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;letter-spacing:.1em;}
.test-create-btn:hover{background:var(--ink2);}
.test-history{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;overflow:hidden;}
.test-hist-row{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--paper3);gap:12px;}
.test-hist-row:last-child{border-bottom:none;}
.test-hist-num{font-size:12px;color:var(--ink4);width:36px;}
.test-hist-info{flex:1;}
.test-hist-score{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--gold);}
.test-hist-meta{font-size:11px;color:var(--ink4);margin-top:2px;}
.test-hist-retry{background:none;border:1px solid var(--paper3);border-radius:6px;padding:5px 12px;font-size:12px;color:var(--ink3);cursor:pointer;}

/* 测试中 */
.test-session{display:flex;flex-direction:column;gap:14px;}
.test-header-bar{display:flex;align-items:center;gap:12px;background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:10px;padding:12px 16px;}
.test-timer{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--jade);min-width:52px;}
.test-timer.urgent{color:var(--red);}
.test-timer-bar{flex:1;height:6px;background:var(--paper3);border-radius:3px;overflow:hidden;}
.test-timer-fill{height:100%;background:linear-gradient(90deg,var(--jade),var(--jade2));border-radius:3px;transition:width 1s linear;}
.test-timer-fill.urgent{background:linear-gradient(90deg,var(--red),#c0392b);}
.test-done-btn{background:var(--ink);color:var(--paper);border:none;border-radius:8px;padding:8px 14px;font-size:12px;cursor:pointer;white-space:nowrap;}
.test-q-list{display:flex;flex-direction:column;gap:14px;}
.test-q-item{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:12px;padding:18px;}
.test-q-meta{font-size:11px;color:var(--ink4);margin-bottom:10px;}
.test-q-text{font-family:'Noto Serif SC',serif;font-size:15px;font-weight:500;color:var(--ink);margin-bottom:14px;line-height:1.7;}
.test-opts{display:flex;flex-direction:column;gap:8px;}
.test-opt{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--paper3);border-radius:8px;cursor:pointer;transition:all .2s;background:rgba(245,240,232,.7);}
.test-opt:hover{border-color:var(--gold2);}
.test-opt.selected{border-color:var(--gold);background:rgba(184,145,42,.08);}
.test-opt.correct{border-color:var(--jade);background:rgba(45,110,90,.08);}
.test-opt.wrong{border-color:var(--red);background:rgba(139,32,32,.06);}
.test-opt-dot{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--paper3);flex-shrink:0;transition:all .2s;display:flex;align-items:center;justify-content:center;}
.test-opt.selected .test-opt-dot{border-color:var(--gold);background:var(--gold);}
.test-opt.correct .test-opt-dot{border-color:var(--jade);background:var(--jade);}
.test-opt.wrong .test-opt-dot{border-color:var(--red);background:var(--red);}
.test-opt-dot-inner{width:8px;height:8px;border-radius:50%;background:white;display:none;}
.test-opt.selected .test-opt-dot-inner,.test-opt.correct .test-opt-dot-inner,.test-opt.wrong .test-opt-dot-inner{display:block;}
.test-opt-text{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink2);}
.test-opt.correct .test-opt-text{color:var(--jade);}
.test-opt.wrong .test-opt-text{color:var(--red);}
.test-feedback{margin-top:10px;font-size:12px;color:var(--ink3);line-height:1.8;padding:8px 12px;border-radius:6px;background:rgba(245,240,232,.8);display:none;}
.test-feedback.show{display:block;}

/* 测试结果 */
.test-result{display:flex;flex-direction:column;align-items:center;gap:16px;padding:10px 0;}
.test-result-score{font-family:'Noto Serif SC',serif;font-size:52px;font-weight:700;color:var(--gold);}
.test-result-label{font-size:13px;color:var(--ink4);}
.test-result-detail{width:100%;display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.test-result-cell{background:rgba(237,231,216,.6);border:1px solid var(--paper3);border-radius:10px;padding:12px;text-align:center;}
.test-result-cell-num{font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;color:var(--ink);}
.test-result-cell-label{font-size:11px;color:var(--ink4);margin-top:2px;}

/* ════════════════════
   学习指南 View
════════════════════ */
/* ── 学习指南 ── */
.guide-category{margin-bottom:24px;}
.guide-cat-title{font-family:'Noto Serif SC',serif;font-size:14px;font-weight:500;color:var(--ink2);margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.guide-cat-title::before{content:'';display:block;width:3px;height:14px;background:var(--gold);border-radius:2px;}
.guide-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.guide-file{background:rgba(237,231,216,.7);border:1px solid var(--paper3);border-radius:10px;padding:14px 10px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;}
.guide-file:hover{border-color:var(--gold2);background:rgba(184,145,42,.07);transform:translateY(-1px);}
.guide-file-icon{font-size:28px;}
.guide-file-name{font-family:'Noto Serif SC',serif;font-size:12px;color:var(--ink);line-height:1.5;word-break:break-all;}

/* 沉浸式阅读 */
.reader-view{display:none;flex-direction:column;}
.reader-view.active{display:flex;}
.reader-header{display:flex;align-items:center;gap:12px;margin-bottom:20px;}
.reader-back{background:none;border:1px solid var(--paper3);border-radius:6px;padding:6px 12px;font-size:12px;color:var(--ink3);cursor:pointer;}
.reader-title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:700;color:var(--ink);}
.reader-body{font-family:'Noto Serif SC',serif;font-size:14px;color:var(--ink2);line-height:2.4;}
.reader-body p{margin-bottom:12px;}
.reader-loading{color:var(--ink4);font-size:13px;text-align:center;padding:40px 0;}
.reader-error{color:var(--red);font-size:13px;text-align:center;padding:40px 0;}

/* ── Dock ── */
.dock{position:fixed;bottom:0;left:0;right:0;z-index:50;background:rgba(245,240,232,.96);backdrop-filter:blur(12px);border-top:1px solid var(--paper3);display:flex;align-items:stretch;padding-bottom:calc(env(safe-area-inset-bottom,0px) * 0.5);}
.dock-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:10px 0 8px;background:none;border:none;cursor:pointer;color:var(--ink4);transition:color .2s;font-family:'Noto Sans SC',sans-serif;font-size:11px;letter-spacing:.04em;}
.dock-btn.active{color:var(--gold);}
.dock-icon{width:22px;height:22px;flex-shrink:0;}
</style>

<script>
let currentTab = 'study';
let currentMode = '';
let questions = [];
let currentIdx = 0;
let correctCount = 0;
let combo = 0;
let comboTimer = null;
let totalScore = parseInt(localStorage.getItem('learn_score')||'0');
document.getElementById('total-score').textContent = totalScore;

/* ══════════ 题库 ══════════ */
let TIYONG_BANK=[], BAGUA_XIANG={}, XIANG_FROM_GUA=[], GUA_FROM_XIANG=[];
async function loadQuestions(){
  try{
    const res = await fetch('questions.json');
    const data = await res.json();
    TIYONG_BANK = data.tiyong||[];
    XIANG_FROM_GUA = data.xiang_from_gua||[];
    GUA_FROM_XIANG = data.gua_from_xiang||[];
    const bx={};
    XIANG_FROM_GUA.forEach(q=>{
      if(!bx[q.guaNum])bx[q.guaNum]={name:BI[q.guaNum].name,xiang:{}};
      if(!bx[q.guaNum].xiang[q.cat])bx[q.guaNum].xiang[q.cat]=q.allItems;
    });
    BAGUA_XIANG = bx;
    initFlashcards();
    renderGuide();
  }catch(e){ console.error('题库加载失败',e); initFlashcards(); renderGuide(); }
}

/* ══════════ Tab 切换 ══════════ */
function switchTab(tab){
  if(currentTab === tab) return;
  currentTab = tab;
  document.querySelectorAll('.dock-btn[id^="tab-"]').forEach(b=>b.classList.remove('active'));
  const tabBtn = document.getElementById('tab-'+tab);
  if(tabBtn) tabBtn.classList.add('active');
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+tab).classList.add('active');
  hideBackBtn();
  if(tab==='flashcard'){ updateFcStats(); switchFcTab('session'); }
  if(tab==='test') renderTestHistory();
  if(tab==='study') startStudy();
}

function switchFcTab(tab){
  document.querySelectorAll('.fc-tab').forEach(b=>b.classList.remove('active'));
  document.getElementById('fc-tab-'+tab).classList.add('active');
  if(tab==='session'){
    document.getElementById('fc-home').style.display='none';
    document.getElementById('fc-session').style.display='block';
    startFlashcards();
  } else {
    document.getElementById('fc-home').style.display='block';
    document.getElementById('fc-session').style.display='none';
    updateFcStats();
    renderFcCategories();
    hideBackBtn();
  }
}

function goBack(){
  if(currentTab==='study'){ /* 无首页，不做处理 */ }
  else if(currentTab==='flashcard'){ quitFlashcards(); }
  else if(currentTab==='test'){ showTestHome(); }
  else if(currentTab==='guide'){ closeReader(); return; }
  hideBackBtn();
}
function showBackBtn(){
  document.getElementById('home-btn').style.display='none';
  document.getElementById('back-btn').style.display='inline-flex';
}
function hideBackBtn(){
  document.getElementById('home-btn').style.display='inline-flex';
  document.getElementById('back-btn').style.display='none';
}

/* ══════════════════════════════
   智能学习
══════════════════════════════ */
/* ══ 智能学习设置 ══ */
let studySettings = { cats:['recognize','xiang','tiyong','jixiong'], count:10 };

function showStudyHome(){ startModeWithSettings(); }

function startStudy(){
  startModeWithSettings();
}

function startModeWithSettings(){
  try{
    const {cats, count} = studySettings;
    questions = [];
    for(let i=0;i<count;i++){
      const cat = cats[i % cats.length];
      questions.push(genQuestions(cat,1)[0]);
    }
    shuffle(questions);
    currentIdx=0; correctCount=0; combo=0;
    document.getElementById('quiz-wrap').style.display='flex';
    document.getElementById('result-view').classList.remove('active');
    document.getElementById('mode-label').textContent='智能学习';
    document.getElementById('q-total').textContent=questions.length;
    renderQuestion();
  }catch(e){ console.error('启动失败',e); }
}

function startMode(mode){ currentMode=mode; startModeWithSettings(); }
function retryMode(){ startModeWithSettings(); }
function quitQuiz(){}

function openSettings(){ document.getElementById('settings-overlay').classList.add('show'); }

function yaoLines(uL, dL, dongIdx, size=1){
  const all=[...dL,...uL], names=['初','二','三','四','五','上'];
  return`<div class="yao-lines">${all.map((l,i)=>{

    </div>`;
  }).join('')}</div>`;
}

/* ── 题目生成 ── */
function genXiangFromGuaQ(){
  if(!XIANG_FROM_GUA.length)return genRecognizeQ();
  const pool=XIANG_FROM_GUA;
  const item=pool[Math.floor(Math.random()*pool.length)];
  const n=item.guaNum, info=BI[n];
  const correct=item.answer;
  const wrongPool=[];
  XIANG_FROM_GUA.forEach(q=>{ if(q.guaNum!==n&&q.cat===item.cat) wrongPool.push(q.answer); });
  const wrongs=shuffle([...new Set(wrongPool)].filter(x=>x!==correct)).slice(0,3);
  const opts=shuffle([correct,...wrongs]);
  return{type:'xiang_from_gua',guaNum:n,lines:BL[n],cat:item.cat,answer:correct,
    options:opts.map(o=>({val:o,label:o})),
    explain:`${info.name}卦（${info.attr}·${info.wx}）在「${item.cat}」类象中包含：${(item.allItems||[correct]).join('、')}等。`};
}
function genGuaFromXiangQ(){
  if(!GUA_FROM_XIANG.length)return genRecognizeQ();
  const item=GUA_FROM_XIANG[Math.floor(Math.random()*GUA_FROM_XIANG.length)];
  const n=item.guaNum, info=BI[n];
  const others=Object.keys(BI).map(Number).filter(k=>k!==n);
  shuffle(others);
  const opts=shuffle([n,...others.slice(0,3)]);
  return{type:'gua_from_xiang',item:item.item,cat:item.cat,answer:String(n),
    options:opts.map(k=>({val:String(k),label:BI[k].name,sub:`${BI[k].attr}·${BI[k].wx}`})),
    explain:`「${item.item}」属于${info.name}卦（${info.attr}·${info.wx}）的「${item.cat}」类象。`};
}
function genRecognizeQ(){
  const n=Math.floor(Math.random()*8)+1, info=BI[n], lines=BL[n];
  const others=Object.keys(BI).map(Number).filter(k=>k!==n);
  shuffle(others);
  const wrong=others.slice(0,3);
  const opts=shuffle([n,...wrong]);
  return{type:'lines2name',guaNum:n,answer:n,lines,
    options:opts.map(k=>({val:k,label:BI[k].name,sub:`${BI[k].attr}·${BI[k].wx}·${BI[k].nat}`})),
    explain:`${info.name}卦：${info.attr}·${info.wx}·${info.nat}`};
}
function genTiyongQ(){
  if(!TIYONG_BANK.length)return genRecognizeQ();
  const item=TIYONG_BANK[Math.floor(Math.random()*TIYONG_BANK.length)];
  const wrongOpts=["你为体，对方为用","对方为体，你为用","上卦为体，下卦为用","下卦为体，上卦为用","物件为体，你为用","男方为上卦（体），女方为下卦（用）","男方为上卦（用），女方为下卦（体）"];
  const wrongs=shuffle(wrongOpts.filter(o=>o!==item.answer)).slice(0,3);
  const opts=shuffle([item.answer,...wrongs]);
  return{type:'tiyong',qText:item.q,answer:item.answer,
    options:opts.map(o=>({val:o,label:o})),explain:item.explain};
}
function genJixiongQ(){
  const g=GUA64[Math.floor(Math.random()*GUA64.length)];
  const tiI=BI[g.u], yongI=BI[g.d];
  const tiWx=tiI.wx, yongWx=yongI.wx;
  let answer='mid', rel='', explain='';
  if(WX_SHENG[yongWx]===tiWx){answer='good';rel='用生体';explain=`用卦${yongI.name}（${yongWx}）生体卦${tiI.name}（${tiWx}），用生体，较为有利。`;}
  else if(WX_SHENG[tiWx]===yongWx){answer='bad';rel='体生用';explain=`体卦${tiI.name}（${tiWx}）生用卦${yongI.name}（${yongWx}），体生用，体卦泄气，不利。`;}
  else if(WX_KE[yongWx]===tiWx){answer='bad';rel='用克体';explain=`用卦${yongI.name}（${yongWx}）克体卦${tiI.name}（${tiWx}），用克体，不利。`;}
  else if(WX_KE[tiWx]===yongWx){answer='good';rel='体克用';explain=`体卦${tiI.name}（${tiWx}）克用卦${yongI.name}（${yongWx}），体克用，有利。`;}
  else{rel='比和';explain=`体卦${tiI.name}与用卦${yongI.name}同属${tiWx}，比和平稳。`;}
  const opts=shuffle([
    {val:'good',label:'有利',sub:'用生体 或 体克用'},
    {val:'bad',label:'不利',sub:'用克体 或 体生用'},
    {val:'mid',label:'平稳',sub:'比和'},
  ]);
  return{type:'jixiong',g,tiI,yongI,tiWx,yongWx,rel,answer,options:opts,explain};
}
function lines2num(ls){
  const m={'y,y,y':1,'y,y,n':2,'y,n,y':3,'y,n,n':4,'n,y,y':5,'n,y,n':6,'n,n,y':7,'n,n,n':8};
  return m[ls.join(',')]||1;
}
function genHuGuaQ(){
  const g=GUA64[Math.floor(Math.random()*GUA64.length)];
  const all=[...BL[g.d],...BL[g.u]];
  const huDL=[all[1],all[2],all[3]], huUL=[all[2],all[3],all[4]];
  const huD=lines2num(huDL), huU=lines2num(huUL);
  const huInfo=GUA64.find(x=>x.u===huU&&x.d===huD);
  const huName=huInfo?huInfo.n:'未知卦';
  const others=GUA64.filter(x=>!(x.u===huU&&x.d===huD));
  shuffle(others);
  const wrongs=others.slice(0,3).map(x=>x.n);
  const opts=shuffle([huName,...wrongs]);
  return{type:'hugua',benGua:g,all,huD,huU,answer:huName,
    options:opts.map(o=>({val:o,label:o})),
    explain:`互卦取第2、3、4爻组成下互卦（${BI[huD].name}），第3、4、5爻组成上互卦（${BI[huU].name}），合为${huName}。`};
}
function genBianGuaQ(){
  const g=GUA64[Math.floor(Math.random()*GUA64.length)];
  const all=[...BL[g.d],...BL[g.u]];
  const dong=Math.floor(Math.random()*6);
  const bAll=all.map((l,i)=>i===dong?(l==='y'?'n':'y'):l);
  const bD=lines2num(bAll.slice(0,3)), bU=lines2num(bAll.slice(3));
  const bianInfo=GUA64.find(x=>x.u===bU&&x.d===bD);
  const bianName=bianInfo?bianInfo.n:'未知卦';
  const dongNames=['初','二','三','四','五','上'];
  const others=GUA64.filter(x=>!(x.u===bU&&x.d===bD));
  shuffle(others);
  const wrongs=others.slice(0,3).map(x=>x.n);
  const opts=shuffle([bianName,...wrongs]);
  return{type:'biangua',benGua:g,all,dong,bAll,bD,bU,answer:bianName,
    options:opts.map(o=>({val:o,label:o})),
    explain:`第${dongNames[dong]}爻为动爻，${all[dong]==='y'?'阳爻变阴爻':'阴爻变阳爻'}，上卦变为${BI[bU].name}，下卦变为${BI[bD].name}，合为变卦${bianName}。`};
}
function genQuestions(mode, count=10){
  const qs=[];
  for(let i=0;i<count;i++){
    if(mode==='recognize'){
      const r=Math.random();
      if(r<0.25)qs.push(genRecognizeQ());
      else if(r<0.50)qs.push(genHuGuaQ());
      else if(r<0.75)qs.push(genBianGuaQ());
      else qs.push(Math.random()<0.5?genXiangFromGuaQ():genGuaFromXiangQ());
    }
    else if(mode==='xiang') qs.push(Math.random()<0.5?genXiangFromGuaQ():genGuaFromXiangQ());
    else if(mode==='tiyong') qs.push(genTiyongQ());
    else qs.push(genJixiongQ());
  }
  return qs;
}

/* ── 渲染题目 ── */
function renderQuestion(){
  const q=questions[currentIdx];
  if(!q){ showResult(); return; }
  const pct=((currentIdx)/questions.length*100);
  document.getElementById('q-current').textContent = currentIdx+1;
  document.getElementById('progress-fill').style.width = pct+'%';
  document.getElementById('explain-card').className='explain-card';
  document.getElementById('next-btn').className='next-btn';

  const qEl=document.getElementById('quiz-question');
  const optsEl=document.getElementById('options-grid');
  let qHtml='';

  if(q.type==='lines2name'){
    const lHtml=BL[q.answer].map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}"></div></div>`).join('');
    qHtml=`<div class="quiz-q-label">看爻线，选出对应的卦名</div>
      <div class="quiz-gua-display"><div class="quiz-gua-item">
        <div class="yao-lines">${lHtml}</div>
      </div></div>`;
  } else if(q.type==='hugua'||q.type==='biangua'){
    const {benGua,all,dong}=q, dongNames=['初','二','三','四','五','上'], isHu=q.type==='hugua';
    const lHtml=all.map((l,i)=>{
      const isDong=!isHu&&i===dong;
      return`<div class="yao-row">
        <div class="yao-num" style="font-size:9px;color:var(--ink4);width:14px;">${dongNames[i]}</div>
        <div class="yao-line ${l==='y'?'yang':'yin'}${isDong?' dong':''}"></div>
        ${isDong?'<div class="dong-mark">●</div>':'<div style="width:10px"></div>'}
      </div>`;
    }).join('');
    qHtml=`<div class="quiz-q-label">${isHu?'看本卦，选出互卦':'看本卦和动爻，选出变卦'}</div>
      <div class="quiz-gua-display"><div class="quiz-gua-item">
        <div class="quiz-gua-label">本卦：${benGua.n}</div>
        <div class="yao-lines">${lHtml}</div>
      </div></div>
      <div class="quiz-hint">${isHu?'互卦：取第2、3、4爻为下卦，第3、4、5爻为上卦':`第${dongNames[dong]}爻为动爻（红色）`}</div>`;
  } else if(q.type==='xiang_from_gua'){
    const lHtml=BL[q.guaNum].map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}"></div></div>`).join('');
    qHtml=`<div class="quiz-q-label">看卦象，选出「${q.cat}」类象</div>
      <div class="quiz-gua-display"><div class="quiz-gua-item">
        <div class="yao-lines">${lHtml}</div>
        <div class="quiz-gua-name">${BI[q.guaNum].name}</div>
        <div class="quiz-gua-attr">${BI[q.guaNum].attr}·${BI[q.guaNum].wx}</div>
      </div></div>`;
  } else if(q.type==='gua_from_xiang'){
    qHtml=`<div class="quiz-q-label">根据类象，选出对应的卦</div>
      <div style="font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;text-align:center;padding:16px 0;color:var(--gold);">「${q.item}」</div>
      <div class="quiz-hint">以上事物属于哪个卦的「${q.cat}」类象？</div>`;
  } else if(q.type==='tiyong'){
    qHtml=`<div class="quiz-q-label">判断体用关系</div>
      <div class="quiz-question-text">${q.qText}</div>
      <div class="quiz-hint">核心原则：以不动的为体，动的为用</div>`;
  } else if(q.type==='jixiong'){
    const {tiI,yongI,tiWx,yongWx}=q;
    const tiLines=BL[q.g.u].map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}" style="width:36px"></div></div>`).join('');
    const yoLines=BL[q.g.d].map(l=>`<div class="yao-row"><div class="yao-line ${l==='y'?'yang':'yin'}" style="width:36px"></div></div>`).join('');
    qHtml=`<div class="quiz-q-label">判断吉凶走向</div>
      <div class="quiz-gua-display">
        <div class="quiz-gua-item">
          <div class="quiz-gua-label">体卦（主）</div>
          <div class="yao-lines">${tiLines}</div>
          <div class="quiz-gua-name">${tiI.name}</div>
          <div class="quiz-gua-attr">${tiI.attr}·${tiWx}</div>
        </div>
        <div style="font-size:20px;color:var(--ink4);align-self:center;">⇌</div>
        <div class="quiz-gua-item">
          <div class="quiz-gua-label">用卦（客）</div>
          <div class="yao-lines">${yoLines}</div>
          <div class="quiz-gua-name">${yongI.name}</div>
          <div class="quiz-gua-attr">${yongI.attr}·${yongWx}</div>
        </div>
      </div>
      <div class="quiz-hint">五行关系：<strong>${tiWx} vs ${yongWx}</strong>　用生体/体克用→有利，用克体/体生用→不利，比和→平稳</div>`;
  }

  qEl.innerHTML = qHtml;

  // 选项
  const shuffledOpts = shuffle([...q.options]);
  const isGua = q.type==='xiang_from_gua'&&false;
  if(q.type==='gua_from_xiang'){
    optsEl.className='options-grid';
    optsEl.innerHTML=shuffledOpts.map(o=>`
      <button class="option-btn" data-val="${o.val}" data-answer="${q.answer}" data-explain="${(q.explain||'').replace(/"/g,'&quot;')}" onclick="selectOpt(this)">
        <span>${o.label}</span>${o.sub?`<span class="option-sub">${o.sub}</span>`:''}
      </button>`).join('');
  } else if(q.type==='tiyong'||q.type==='xiang_from_gua'||q.type==='hugua'||q.type==='biangua'){
    optsEl.className='options-grid single';
    optsEl.innerHTML=shuffledOpts.map(o=>`
      <button class="option-btn" data-val="${(o.val+'').replace(/"/g,'&quot;')}" data-answer="${(q.answer+'').replace(/"/g,'&quot;')}" data-explain="${(q.explain||'').replace(/"/g,'&quot;')}" onclick="selectOpt(this)">
        <span>${o.label}</span>${o.sub?`<span class="option-sub">${o.sub}</span>`:''}
      </button>`).join('');
  } else {
    optsEl.className='options-grid';
    optsEl.innerHTML=shuffledOpts.map(o=>`
      <button class="option-btn" data-val="${(o.val+'').replace(/"/g,'&quot;')}" data-answer="${(q.answer+'').replace(/"/g,'&quot;')}" data-explain="${(q.explain||'').replace(/"/g,'&quot;')}" onclick="selectOpt(this)">
        <span>${o.label}</span>${o.sub?`<span class="option-sub">${o.sub}</span>`:''}
      </button>`).join('');
  }
}

function selectOpt(btn){
  const val=btn.getAttribute('data-val');
  const answer=btn.getAttribute('data-answer');
  const explain=btn.getAttribute('data-explain')||'';
  document.querySelectorAll('.option-btn').forEach(b=>b.disabled=true);
  const isCorrect=String(val)===String(answer);
  document.querySelectorAll('.option-btn').forEach(b=>{
    const bv=b.getAttribute('data-val');
    if(String(bv)===String(answer)) b.classList.add(isCorrect?'correct':'reveal');
    else if(b===btn&&!isCorrect) b.classList.add('wrong');
  });
  const ec=document.getElementById('explain-card');
  if(isCorrect){
    correctCount++;
    combo++;
    const pts=combo>=3?20:combo>=2?15:10;
    totalScore+=pts;
    localStorage.setItem('learn_score',totalScore);
    document.getElementById('total-score').textContent=totalScore;
    scheduleSync();
    if(combo>=2) showCombo(combo,pts);
    ec.innerHTML=`<div class="explain-result"><span class="result-icon">✓</span><span class="result-text correct">回答正确 +${pts}分</span></div><div class="explain-body">${explain}</div>`;
  } else {
    combo=0;
    ec.innerHTML=`<div class="explain-result"><span class="result-icon">✗</span><span class="result-text wrong">回答错误</span></div><div class="explain-body">${explain}</div>`;
  }
  ec.classList.add('show');
  document.getElementById('next-btn').classList.add('show');
}

function nextQuestion(){
  currentIdx++;
  if(currentIdx>=questions.length){ showResult(); return; }
  renderQuestion();
}

function showResult(){
  document.getElementById('quiz-wrap').style.display='none';
  const rv=document.getElementById('result-view');
  const pct=Math.round((correctCount/questions.length)*100);
  const stars=pct===100?3:pct>=67?2:1;
  document.getElementById('r-score').textContent=`${correctCount}/${questions.length}`;
  document.getElementById('r-stars').textContent=['★','★★','★★★'][stars-1];
  document.getElementById('r-title').textContent=pct===100?'完美！':pct>=67?'不错！':'继续加油！';
  document.getElementById('r-desc').textContent=pct===100?'全部答对，继续保持！':pct>=67?`答对 ${correctCount} 题，再练练剩余的。`:`答对 ${correctCount} 题，建议多加练习。`;
  rv.classList.add('active');
  hideBackBtn();
}

function showCombo(n,pts){
  const el=document.getElementById('combo-toast');
  el.textContent=`连击 ${n}× +${pts}分`;
  el.classList.add('show');
  clearTimeout(comboTimer);
  comboTimer=setTimeout(()=>el.classList.remove('show'),1500);
}

let FC_CARDS = [...FC_CARDS_FALLBACK];
const FC_JSON_URL = 'https://raw.githubusercontent.com/xenodovidio/Meihua_Yishu/main/lesson_document/test/flashcards.json';

async function loadFlashcards(){
  try{
    const res = await fetch(FC_JSON_URL);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    FC_CARDS = data;
    initFlashcards();
    renderFcCategories();
  }catch(e){
    console.warn('闪卡远程加载失败，使用本地备用数据', e);
    FC_CARDS = [...FC_CARDS_FALLBACK];
    initFlashcards();
    renderFcCategories();
  }
}

let fcState = JSON.parse(localStorage.getItem('fc_state')||'{}');
let fcQueue = [];
let fcCurrentIdx = 0;
let fcFlipped = false;

function initFlashcards(){
  FC_CARDS.forEach(c=>{
    if(!fcState[c.id]) fcState[c.id]={status:'new',interval:1,ef:2.5,due:0};
  });
  updateFcStats();
  renderFcCategories();
}

function updateFcStats(){
  const now=Date.now();
  let learning=0, review=0, mastered=0;
  FC_CARDS.forEach(c=>{
    const s=fcState[c.id];
    if(!s||s.status==='new') learning++;
    else if(s.status==='mastered') mastered++;
    else if(s.due<=now) review++;
    else mastered++;
  });
  document.getElementById('fc-learning').textContent=learning;
  document.getElementById('fc-review').textContent=review;
  document.getElementById('fc-mastered').textContent=mastered;
  document.getElementById('fc-total').textContent=FC_CARDS.length;
  const btn=document.getElementById('fc-start-btn')||null;
  if(btn) btn.disabled=learning+review===0;
}

function renderFcCategories(){
  const cats={};
  FC_CARDS.forEach(c=>{ if(!cats[c.cat])cats[c.cat]=0; cats[c.cat]++; });
  const el=document.getElementById('fc-categories');
  el.innerHTML=Object.entries(cats).map(([cat,count])=>`
    <div class="fc-category" onclick="toggleFcCat(this,'${cat}')">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <div class="fc-cat-name">${cat}</div>
        <div style="display:flex;align-items:center;gap:8px;">
          <div class="fc-cat-count">${count} 张</div>
          <div class="fc-cat-arrow">›</div>
        </div>
      </div>
      <div class="fc-cat-list" style="display:none;"></div>
    </div>`).join('');
}

function toggleFcCat(el, cat){
  const list=el.querySelector('.fc-cat-list');
  const arrow=el.querySelector('.fc-cat-arrow');
  const isOpen=list.style.display!=='none';
  if(isOpen){
    list.style.display='none';
    arrow.style.transform='';
  } else {
    const cards=FC_CARDS.filter(c=>c.cat===cat);
    list.innerHTML=`<div class="fc-card-list">${cards.map(c=>`
      <div class="fc-card-item">
        <div class="fc-card-item-front">${c.front}</div>
        ${c.frontSub?`<div class="fc-card-item-sub">${c.frontSub}</div>`:''}
      </div>`).join('')}</div>`;
    list.style.display='block';
    arrow.style.transform='rotate(90deg)';
  }
}

function startFlashcards(){
  const now=Date.now();
  fcQueue=FC_CARDS.filter(c=>{
    const s=fcState[c.id];
    return !s||s.status==='new'||s.due<=now;
  });
  if(!fcQueue.length){
    switchFcTab('home');
    return;
  }
  shuffle(fcQueue);

  document.getElementById('fc-home').style.display='none';
  document.getElementById('fc-session').style.display='block';

function startFlashcardsCat(cat){
  fcQueue=FC_CARDS.filter(c=>c.cat===cat);

function renderFcCard(){
  if(fcCurrentIdx>=fcQueue.length){ quitFlashcards(); updateFcStats(); return; }
  const c=fcQueue[fcCurrentIdx];
  fcFlipped=false;
  const card=document.getElementById('fc-card');
  // 先禁用过渡动画，立即重置到正面，再恢复动画
  card.style.transition='none';
  card.classList.remove('flipped');
  void card.offsetWidth; // 强制重绘，确保transition:none生效
  card.style.transition='';
  document.getElementById('fc-front-main').textContent=c.front;
  document.getElementById('fc-front-sub').textContent=c.frontSub||'';
  document.getElementById('fc-back-main').innerHTML=c.back.replace(/\n/g,'<br>');
  document.getElementById('fc-back-sub').textContent=c.backSub||'';

}

function flipCard(){
  fcFlipped = !fcFlipped;
  const card = document.getElementById('fc-card');
  card.classList.toggle('flipped', fcFlipped);
  document.getElementById('fc-flip-hint').textContent = fcFlipped ? '根据掌握程度左右拖拽评分' : '点击翻转 · 左右拖拽评分';
  // 翻转到答案面时，翻转完成后触发闪光
  if(fcFlipped){
    setTimeout(()=>{
      const shine = document.getElementById('fc-shine');
      if(!shine) return;
      shine.classList.remove('active');
      void shine.offsetWidth;
      shine.classList.add('active');
      setTimeout(()=>shine.classList.remove('active'), 700);
    }, 0);
  } else {
    setTimeout(()=>{
      const shine = document.getElementById('fc-shine-front');
      if(!shine) return;
      shine.classList.remove('active');
      void shine.offsetWidth;
      shine.classList.add('active');
      setTimeout(()=>shine.classList.remove('active'), 700);
    }, 0);
  }
}

/* ── 拖拽手势 ── */
let dragStartX = 0, dragStartY = 0, dragCurX = 0, isDragging = false, dragMoved = false;
const DRAG_THRESHOLD = 80; // 触发评分的最小拖拽距离

function initCardDrag() {
  const card = document.getElementById('fc-card');
  if (!card) return;

  // Touch
  card.addEventListener('touchstart', e => {
    dragStartX = e.touches[0].clientX;
    dragStartY = e.touches[0].clientY;
    isDragging = true; dragMoved = false;
    card.classList.add('dragging');
  }, { passive: true });

  card.addEventListener('touchmove', e => {
    if (!isDragging) return;
    dragCurX = e.touches[0].clientX - dragStartX;
    const dragCurY = e.touches[0].clientY - dragStartY;
    if (Math.abs(dragCurX) > Math.abs(dragCurY) && Math.abs(dragCurX) > 10) {
      e.preventDefault();
      dragMoved = true;
      updateDragVisual(dragCurX);
    }
  }, { passive: false });

  card.addEventListener('touchend', () => {
    if (!isDragging) return;
    isDragging = false;
    card.classList.remove('dragging');
    if (dragMoved) {
      handleDragEnd(dragCurX);
    } else {
      flipCard();
    }
    resetDragVisual();
    dragMoved = false; dragCurX = 0;
  });

  // Mouse
  card.addEventListener('mousedown', e => {
    dragStartX = e.clientX;
    isDragging = true; dragMoved = false;
    card.classList.add('dragging');
  });

  window.addEventListener('mousemove', e => {
    if (!isDragging) return;
    dragCurX = e.clientX - dragStartX;
    if (Math.abs(dragCurX) > 10) {
      dragMoved = true;
      updateDragVisual(dragCurX);
    }
  });

  window.addEventListener('mouseup', () => {
    if (!isDragging) return;
    isDragging = false;
    document.getElementById('fc-card')?.classList.remove('dragging');
    if (dragMoved) {
      handleDragEnd(dragCurX);
    } else {
      flipCard();
    }
    resetDragVisual();
    dragMoved = false; dragCurX = 0;
  });
}

function updateDragVisual(dx) {
  const card = document.getElementById('fc-card');
  const badLabel = document.getElementById('fc-label-bad');
  const goodLabel = document.getElementById('fc-label-good');
  if (!card) return;

  // 卡片跟随移动 + 旋转
  const rotate = dx * 0.08;
  card.style.transform = fcFlipped
    ? `rotateY(180deg) translateX(${-dx}px) rotate(${-rotate}deg)`
    : `translateX(${dx}px) rotate(${rotate}deg)`;

  if (dx < -10) {
    card.classList.add('glow-bad'); card.classList.remove('glow-good');
    badLabel.classList.add('show'); goodLabel.classList.remove('show');
  } else if (dx > 10) {
    card.classList.add('glow-good'); card.classList.remove('glow-bad');
    goodLabel.classList.add('show'); badLabel.classList.remove('show');
  } else {
    card.classList.remove('glow-bad','glow-good');
    badLabel.classList.remove('show'); goodLabel.classList.remove('show');
  }
}

function resetDragVisual() {
  const card = document.getElementById('fc-card');
  if (!card) return;
  // 带弹回动画
  card.style.transition = 'transform .3s cubic-bezier(.34,1.56,.64,1)';
  card.style.transform = fcFlipped ? 'rotateY(180deg)' : '';
  setTimeout(() => { if(card) card.style.transition = ''; }, 320);
  card.classList.remove('glow-bad','glow-good');
  document.getElementById('fc-label-bad')?.classList.remove('show');
  document.getElementById('fc-label-good')?.classList.remove('show');
}

function handleDragEnd(dx) {
  if (Math.abs(dx) < DRAG_THRESHOLD) return;
  const card = document.getElementById('fc-card');
  if (card) {
    const dir = dx < 0 ? -1 : 1;
    card.style.transition = 'transform .3s ease, opacity .3s ease';
    card.style.transform = (fcFlipped ? 'rotateY(180deg) ' : '') + `translateX(${dir * 400}px) rotate(${dir * 20}deg)`;
    card.style.opacity = '0';
    setTimeout(() => {
      card.style.transition = '';
      card.style.transform = '';
      card.style.opacity = '';
      if (dx < 0) rateCard(0);
      else rateCard(2);
    }, 280);
  } else {
    if (dx < 0) rateCard(0);
    else rateCard(2);
  }
}

function rateCard(rating){
  const c=fcQueue[fcCurrentIdx];
  const s=fcState[c.id];
  if(rating===2){ s.status='mastered'; s.interval=Math.max(s.interval*2,1); s.due=Date.now()+s.interval*24*3600*1000; }
  else if(rating===1){ s.status='review'; s.interval=1; s.due=Date.now()+3600*1000; }
  else { s.status='review'; s.interval=1; s.due=Date.now()+600*1000; }
  localStorage.setItem('fc_state',JSON.stringify(fcState));
  scheduleSync();
  fcCurrentIdx++;
  renderFcCard();
}

let testTime=10, testCount=10;
let testTimer=null, testSecondsLeft=0, testTotalSeconds=0;
let testQuestions=[], testHistory=[];

function adjustTime(d){ testTime=Math.max(5,Math.min(60,testTime+d)); document.getElementById('test-time-val').textContent=testTime; }
function adjustCount(d){ testCount=Math.max(5,Math.min(30,testCount+d)); document.getElementById('test-count-val').textContent=testCount; }

function startTest(){
  testQuestions=[];
  const modes=['recognize','xiang','tiyong','jixiong'];
  for(let i=0;i<testCount;i++) testQuestions.push(genQuestions(modes[i%modes.length],1)[0]);
  testSecondsLeft=testTime*60;
  testTotalSeconds=testSecondsLeft;
  document.getElementById('test-home').style.display='none';
  document.getElementById('test-result-view').style.display='none';
  document.getElementById('test-session').style.display='block';
  showBackBtn();
  renderTestQuestions();
  startTestTimer();
}

function renderTestQuestions(){
  const list=document.getElementById('test-q-list');
  list.innerHTML=testQuestions.map((q,i)=>renderTestQ(q,i)).join('');
}

function renderTestQ(q,i){
  const opts=shuffle([...q.options]);
  let optsHtml='';
  if(q.type==='tiyong'||q.type==='xiang_from_gua'||q.type==='hugua'||q.type==='biangua'){
    optsHtml=opts.map(o=>`
      <div class="test-opt" onclick="selectTestOpt(this,${i},'${(o.val+'').replace(/'/g,"\\'")}','${(q.answer+'').replace(/'/g,"\\'")}')">
        <div class="test-opt-dot"><div class="test-opt-dot-inner"></div></div>
        <div class="test-opt-text">${o.label}</div>
      </div>`).join('');
  } else {
    optsHtml=opts.map(o=>`
      <div class="test-opt" onclick="selectTestOpt(this,${i},'${(o.val+'').replace(/'/g,"\\'")}','${(q.answer+'').replace(/'/g,"\\'")}')">
        <div class="test-opt-dot"><div class="test-opt-dot-inner"></div></div>
        <div class="test-opt-text">${o.label}${o.sub?` <span style="color:var(--ink4);font-size:12px;">·${o.sub}</span>`:''}</div>
      </div>`).join('');
  }
  const typeLabel={lines2name:'识卦',hugua:'互卦',biangua:'变卦',xiang_from_gua:'类象',gua_from_xiang:'类象',tiyong:'体用',jixiong:'吉凶'}[q.type]||'练习';
  return`<div class="test-q-item" id="tq-${i}">
    <div class="test-q-meta">${i+1} / ${testQuestions.length} — ${typeLabel}</div>
    <div class="test-q-text">${getTestQText(q)}</div>
    <div class="test-opts" id="topts-${i}">${optsHtml}</div>
    <div class="test-feedback" id="tfb-${i}"></div>
  </div>`;
}

function getTestQText(q){
  if(q.type==='tiyong') return q.qText;
  if(q.type==='xiang_from_gua') return `${BI[q.guaNum].name}卦的「${q.cat}」类象是哪个？`;
  if(q.type==='gua_from_xiang') return `「${q.item}」属于哪个卦的「${q.cat}」类象？`;
  if(q.type==='lines2name') return '看爻线，这是哪个卦？';
  if(q.type==='hugua') return `${q.benGua.n}的互卦是？`;
  if(q.type==='biangua'){const d=['初','二','三','四','五','上'][q.dong];return `${q.benGua.n}第${d}爻动，变卦是？`;}
  if(q.type==='jixiong') return `${q.tiI.name}（体）vs ${q.yongI.name}（用），五行关系如何？`;
  return '判断以下哪个是正确答案？';
}

function selectTestOpt(el,qi,val,answer){
  const opts=document.querySelectorAll(`#topts-${qi} .test-opt`);
  // 如果已选择就不再改变
  if([...opts].some(o=>o.classList.contains('selected'))) return;
  el.classList.add('selected');
  const fb=document.getElementById(`tfb-${qi}`);
  const q=testQuestions[qi];
  if(String(val)===String(answer)){
    el.classList.add('correct');
    fb.textContent='✓ '+q.explain;
  } else {
    el.classList.add('wrong');
    opts.forEach(o=>{ if(o.querySelector('.test-opt-text').textContent.startsWith(answer)||o.getAttribute('onclick')?.includes(answer)) o.classList.add('correct'); });
    fb.textContent='✗ '+q.explain;
  }
  fb.classList.add('show');
}

function startTestTimer(){
  clearInterval(testTimer);
  updateTimerDisplay();
  testTimer=setInterval(()=>{
    testSecondsLeft--;
    updateTimerDisplay();
    if(testSecondsLeft<=0){ clearInterval(testTimer); finishTest(); }
  },1000);
}

function updateTimerDisplay(){
  const m=Math.floor(testSecondsLeft/60), s=testSecondsLeft%60;
  const str=`${m}:${s.toString().padStart(2,'0')}`;
  document.getElementById('test-timer').textContent=str;
  const pct=(testSecondsLeft/testTotalSeconds)*100;
  document.getElementById('test-timer-fill').style.width=pct+'%';
  const urgent=testSecondsLeft<60;
  document.getElementById('test-timer').classList.toggle('urgent',urgent);
  document.getElementById('test-timer-fill').classList.toggle('urgent',urgent);
}

function finishTest(){
  clearInterval(testTimer);
  let correct=0, wrong=0, skip=0;
  testQuestions.forEach((q,i)=>{
    const opts=document.querySelectorAll(`#topts-${i} .test-opt`);
    const selected=[...opts].find(o=>o.classList.contains('selected'));
    if(!selected) skip++;
    else if(selected.classList.contains('correct')) correct++;
    else wrong++;
  });
  const total=testQuestions.length;
  const pct=Math.round((correct/total)*100);
  // 保存记录
  testHistory.unshift({date:new Date().toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}),score:pct,correct,total});
  if(testHistory.length>10) testHistory=testHistory.slice(0,10);
  localStorage.setItem('test_history',JSON.stringify(testHistory));

  document.getElementById('test-session').style.display='none';
  document.getElementById('test-result-view').style.display='block';
  document.getElementById('test-result-pct').textContent=pct+'%';
  document.getElementById('tr-correct').textContent=correct;
  document.getElementById('tr-wrong').textContent=wrong;
  document.getElementById('tr-skip').textContent=skip;
}

function showTestHome(){
  clearInterval(testTimer);
  document.getElementById('test-home').style.display='block';
  document.getElementById('test-session').style.display='none';
  document.getElementById('test-result-view').style.display='none';
  hideBackBtn();
  renderTestHistory();
}

function renderTestHistory(){
  testHistory=JSON.parse(localStorage.getItem('test_history')||'[]');
  const list=document.getElementById('test-history-list');
  const wrap=document.getElementById('test-history-wrap');
  if(!testHistory.length){ wrap.style.display='none'; return; }
  wrap.style.display='block';
  list.innerHTML=`<div class="test-history">${testHistory.map((h,i)=>`
    <div class="test-hist-row">
      <div class="test-hist-num">测试 ${i+1}</div>
      <div class="test-hist-info">
        <div class="test-hist-score">${h.score}%</div>
        <div class="test-hist-meta">${h.correct}/${h.total} 题 · ${h.date}</div>
      </div>
    </div>`).join('')}</div>`;
}

    ]
  },
];

const guideCache = {};

async function fetchDocx(url) {
  if (guideCache[url]) return guideCache[url];
  const res = await fetch(url);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  const arrayBuffer = await res.arrayBuffer();
  const out = await mammoth.extractRawText({ arrayBuffer });
  guideCache[url] = out.value;
  return out.value;
}

function renderGuide() {
  const el = document.getElementById('guide-categories');
  el.innerHTML = LESSON_CATEGORIES.map(cat => `
    <div class="guide-category">
      <div class="guide-cat-title">${cat.icon} ${cat.title}</div>
      <div class="guide-grid">
        ${cat.files.map(f => `
          <div class="guide-file" onclick="openReader('${encodeURIComponent(f.name)}','${encodeURIComponent(f.url)}')">
            <div class="guide-file-icon">${f.icon}</div>
            <div class="guide-file-name">${f.name}</div>
          </div>`).join('')}
      </div>
    </div>`).join('');
}

async function openReader(encodedName, encodedUrl) {
  const name = decodeURIComponent(encodedName);
  const url = decodeURIComponent(encodedUrl);
  document.getElementById('guide-home').style.display = 'none';
  const rv = document.getElementById('reader-view');
  rv.classList.add('active');
  document.getElementById('reader-title').textContent = name;
  document.getElementById('reader-body').innerHTML = '<div class="reader-loading">加载中...</div>';
  // 不显示header返回键，阅读器自带返回
  hideBackBtn();
  try {
    const text = await fetchDocx(url);
    const paras = text.split('\n').filter(l => l.trim());
    document.getElementById('reader-body').innerHTML = paras.map(p =>
      `<p>${p.trim()}</p>`
    ).join('');
  } catch (e) {
    document.getElementById('reader-body').innerHTML = `<div class="reader-error">加载失败：${e.message}</div>`;
  }
}

function closeReader() {
  document.getElementById('reader-view').classList.remove('active');
  document.getElementById('guide-home').style.display = 'block';
  hideBackBtn();
}

/* ══════════ 工具 ══════════ */
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

/* ══════════ COS 云同步 ══════════ */
const COS_CONFIG = {
  SecretId:  'AKID9B8sOgliV8ZoqeIk074oKcjiV7ZrPuDJ',
  SecretKey: 'znOlura5MRK4as0viYIrJXXM0fBao11n',
  Bucket:    'meihua-yishu-1433827621',
  Region:    'ap-shanghai',
};

let currentUser = null;
let syncTimer = null;

const cos = new COS({
  SecretId: COS_CONFIG.SecretId,
  SecretKey: COS_CONFIG.SecretKey,
});

function cosGet(key){
  return new Promise((resolve)=>{
    cos.getObject({
      Bucket: COS_CONFIG.Bucket,
      Region: COS_CONFIG.Region,
      Key: key,
    }, (err, data)=>{
      if(err){ resolve(null); return; }
      try{ resolve(JSON.parse(data.Body)); }
      catch(e){ resolve(null); }
    });
  });
}

function cosPut(key, data){
  return new Promise((resolve)=>{
    cos.putObject({
      Bucket: COS_CONFIG.Bucket,
      Region: COS_CONFIG.Region,
      Key: key,
      Body: JSON.stringify(data),
      ContentType: 'application/json',
    }, (err)=>{ resolve(!err); });
  });
}

// 从云端加载用户数据
async function loadUserData(){
  if(!currentUser) return;
  try{
    const data = await cosGet(`userdata/${currentUser.username}.json`);
    if(data){
      // 恢复积分
      if(data.score !== undefined){
        totalScore = data.score;
        document.getElementById('total-score').textContent = totalScore;
        localStorage.setItem('meihua_score', totalScore);
      }
      // 恢复闪卡进度
      if(data.fcState){
        fcState = data.fcState;
        localStorage.setItem('fc_state', JSON.stringify(fcState));
      }
    }
  }catch(e){
    console.warn('云端数据加载失败，使用本地数据', e);
  }
}

// 同步数据到云端（防抖，3秒后执行）
function scheduleSync(){
  if(!currentUser) return;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(syncUserData, 3000);
}

async function syncUserData(){
  if(!currentUser) return;
  try{
    await cosPut(`userdata/${currentUser.username}.json`, {
      username: currentUser.username,
      score: totalScore,
      fcState: fcState,
      updatedAt: new Date().toISOString(),
    });
  }catch(e){
    console.warn('云端同步失败', e);
  }
}

function logout(){
  sessionStorage.removeItem('meihua_user');
  window.location.href = 'login.html';
}

/* ── 登录检查 ── */
function checkLogin(){
  const stored = sessionStorage.getItem('meihua_user');
  if(!stored){
    window.location.href = 'login.html';
    return false;
  }
  currentUser = JSON.parse(stored);
  // 显示用户名
  const scoreEl = document.getElementById('total-score');
  if(scoreEl){
    const parent = scoreEl.parentElement;
    if(parent) parent.title = currentUser.nickname || currentUser.username;
  }
  return true;
}

/* ── 积分变动时触发同步 ── */
const _origAddScore = window.addScore;
function addScore(pts, reason){
  if(typeof _origAddScore === 'function') _origAddScore(pts, reason);
  scheduleSync();
}

window.addEventListener('beforeunload', ()=>{ syncUserData(); });
