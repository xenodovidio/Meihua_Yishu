      {type:'jixiong',q:'用生体，吉凶如何？',answer:'大吉，贵人相助',opts:['大吉，贵人相助','小凶，付出多','凶，受阻受压','平，无大变化']},
      {type:'jixiong',q:'用克体，吉凶如何？',answer:'凶，受阻受压',opts:['凶，受阻受压','大吉，贵人相助','平，无大变化','小凶，付出多']},
      {type:'jixiong',q:'体克用，吉凶如何？',answer:'吉，主动有力',opts:['吉，主动有力','凶，受阻受压','大吉，贵人相助','小凶，付出多']},
      {type:'jixiong_full',q:'问事得「地天泰」第二爻动。第二爻在下卦乾（金），体卦为坤（土）。土与金的关系：土生金，这是？',answer:'体生用，小有不利',opts:['体生用，小有不利','用生体，大吉','体克用，吉','用克体，凶']},
      {type:'jixiong_full',q:'问财运，得「水火既济」第五爻动。第五爻在上卦坎（水），体卦为离（火）。水克火，这是？',answer:'用克体，所问财运受阻',opts:['用克体，所问财运受阻','用生体，财运亨通','体克用，财运主动','比和，财运平稳']},
      {type:'jixiong_full',q:'问感情，得「天泽履」第一爻动。第一爻在下卦兑（金），体卦为乾（金）。两卦同为金，这是？',answer:'比和，感情平稳无大波折',opts:['比和，感情平稳无大波折','用生体，感情大吉','用克体，感情受阻','体克用，感情主动']},
    ],
  },
];

const J_CHAPTERS = [
  {title:'第一章 · 认识八卦',lessonIds:[0,1,2,3]},
  {title:'第二章 · 六十四卦',lessonIds:[4,5,6]},
  {title:'第三章 · 体用生克',lessonIds:[7,8,9]},
];

/* ══════════════════════════════════════
   학습之旅 — 函数
══════════════════════════════════════ */

async function jLoadData(){
  if(jDataLoaded) return;
  try{
    const url = `https://${COS_CONFIG.Bucket}.cos.${COS_CONFIG.Region}.myqcloud.com/journey_data.json`;
    console.log('[Journey] 加载URL:', url);
    const res = await fetch(url+'?t='+Date.now());
    console.log('[Journey] HTTP:', res.status, res.ok);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    console.log('[Journey] 章节数:', data?.chapters?.length, '关卡数:', data?.lessons?.length);
    if(data && data.chapters && data.lessons){
      window._J_CHAPTERS_COS = data.chapters.map(ch=>({
        title: ch.title,
        lessonIds: data.lessons.filter(l=>l.chapterId===ch.id).map(l=>l.id)
      }));
      window._J_LESSONS_COS = data.lessons.map(l=>({...l}));
      console.log('[Journey] 加载成功');
      jDataLoaded = true;
    }
  }catch(e){
    console.error('[Journey] 加载失败:', e.message);
    window._J_CHAPTERS_COS = null;
    window._J_LESSONS_COS = null;
  }
}

function getJChapters(){ return window._J_CHAPTERS_COS || J_CHAPTERS; }
function getJLessons(){ return window._J_LESSONS_COS || J_LESSONS; }
function getJLesson(id){ return getJLessons().find(l=>l.id===id||l.id===String(id)); }

function jUpdateHearts(){
  [1,2,3].forEach(i=>{
    const el=document.getElementById(`jh${i}`);
    if(!el)return;
    if(i<=jHearts){el.classList.remove('lost');}
    else{el.classList.add('lost');el.classList.add('heart-beat');setTimeout(()=>el.classList.remove('heart-beat'),300);}
  });
}

function jRenderMap(){
  const mv=document.getElementById('j-map-view');
  const lv=document.getElementById('j-lesson-view');
  if(mv)mv.style.display='block';
  if(lv)lv.style.display='none';
  document.getElementById('j-result-view')?.classList.remove('active');
  document.getElementById('j-fail-view')?.classList.remove('active');

  const path=document.getElementById('j-lessons-path');
  if(!path)return;
  path.innerHTML='';

  const chapters = getJChapters();
  const lessons = getJLessons();

  chapters.forEach(chapter=>{
    const chEl=document.createElement('div');
    chEl.className='map-chapter';
    chEl.innerHTML=`<div class="chapter-title">${chapter.title}</div><div class="lessons-path-inner"></div>`;
    path.appendChild(chEl);
    const inner=chEl.querySelector('.lessons-path-inner');

  chapters.forEach(chapter=>{
    const chEl=document.createElement('div');
    chEl.className='map-chapter';
    chEl.innerHTML=`<div class="chapter-title">${chapter.title}</div><div class="lessons-path-inner"></div>`;
    path.appendChild(chEl);
    const inner=chEl.querySelector('.lessons-path-inner');

    // 找出该章节所有关卡（按lessonIds顺序）
    const chLessons = chapter.lessonIds.map(lid=>lessons.find(x=>String(x.id)===String(lid))).filter(Boolean);

    chLessons.forEach((l,i)=>{
      const done=jProgress[String(l.id)]?.done;
      const stars=jProgress[String(l.id)]?.stars||0;
      // 第一个关卡直接解锁，后续关卡需要前一个完成
      const unlocked = i===0 || jProgress[String(chLessons[i-1]?.id)]?.done;
      const isActive=unlocked&&!done;
      const cls=done?'done':isActive?'active':'locked';
      const statusHtml=done?`<div class="lesson-status status-done">✓ 已完成</div>`:isActive?`<div class="lesson-status status-active">▶ 开始</div>`:`<div class="lesson-status status-lock">🔒</div>`;
      const starsHtml=`<div class="stars-row">${[1,2,3].map(s=>`<span class="j-star${stars>=s?' lit':''}">${stars>=s?'★':'☆'}</span>`).join('')}</div>`;
      const node=document.createElement('div');
      node.className='lesson-node';
      node.innerHTML=`
        ${i>0?`<div class="path-line${jProgress[String(chLessons[i-1]?.id)]?.done?' done':''}"></div>`:''}
        <div class="lesson-btn ${cls}" onclick="${unlocked?`jStartLesson('${l.id}')`:''}">
          <div class="lesson-icon">${l.icon}</div>
          <div class="lesson-info">
            <div class="lesson-name">${l.name}</div>
            <div class="lesson-desc">${l.desc}</div>
            ${starsHtml}
          </div>
          ${statusHtml}
        </div>`;
      inner.appendChild(node);
    });
  });
  });
}

function jStartLesson(id){
  jCurrentLessonId=id;
  jCurrentLesson=getJLesson(id);
  jCurrentStep=0;
  jCorrectCount=0;
  jTotalQuizzes=jCurrentLesson.quizzes.length;
  jHearts=3;
  jUpdateHearts();
  document.getElementById('j-map-view').style.display='none';
  document.getElementById('j-lesson-view').style.display='block';
  document.getElementById('j-result-view').classList.remove('active');
  document.getElementById('j-fail-view').classList.remove('active');
  document.getElementById('j-lp-label').textContent=jCurrentLesson.name;
  document.getElementById('j-lp-total').textContent=jCurrentLesson.teaches.length+jTotalQuizzes;
  jRenderStep();
}

function jRetryLesson(){jStartLesson(jCurrentLessonId);}

function jRenderStep(){
  const totalSteps=jCurrentLesson.teaches.length+jCurrentLesson.quizzes.length;
  document.getElementById('j-lp-cur').textContent=jCurrentStep;
  document.getElementById('j-lp-fill').style.width=`${(jCurrentStep/totalSteps)*100}%`;
  document.getElementById('j-fail-view').classList.remove('active');
  document.getElementById('j-result-view').classList.remove('active');
  const content=document.getElementById('j-lesson-content');

  if(jCurrentStep<jCurrentLesson.teaches.length){
    const t=jCurrentLesson.teaches[jCurrentStep];
    content.innerHTML=`
      <div class="teach-card">
        <div class="teach-icon">${t.icon}</div>
        <div class="teach-title">${t.title}</div>
        <div class="teach-body">${t.body}</div>
        ${t.showBagua?jRenderBaguaGrid():''}
      </div>
      <button class="teach-next" onclick="jNextStep()">明白了，继续 →</button>`;
  } else {
    const qi=jCurrentStep-jCurrentLesson.teaches.length;
    if(qi>=jCurrentLesson.quizzes.length){jShowResult();return;}
    jRenderQuiz(jCurrentLesson.quizzes[qi]);
  }
}

function jRenderBaguaGrid(){
  return`<div class="bagua-grid">${[1,2,3,4,5,6,7,8].map(n=>{
    const info=BI[n];
    const linesHtml=BL[n].map(l=>l==='y'?'<div class="bc-line bc-yang"></div>':'<div class="bc-line bc-yin"></div>').join('');
    return`<div class="bagua-cell"><div class="bc-lines">${linesHtml}</div><div class="bc-name">${info.name}</div><div class="bc-attr">${info.attr}</div></div>`;
  }).join('')}</div>`;
}

function jRenderQuiz(q){
  const content=document.getElementById('j-lesson-content');
  let qHtml='';
  const lineClass=l=>l==='y'?'j-yang':'j-yin';

  if(q.type==='lines2name'){
    const linesHtml=BL[q.answer].map(l=>`<div class="j-yao-row"><div class="j-yao-line ${lineClass(l)}"></div></div>`).join('');
    qHtml=`<div class="quiz-gua-show"><div class="j-yao-lines">${linesHtml}</div></div>`;
  } else if(q.type==='name2lines'){
    qHtml=`<div style="font-family:'Noto Serif SC',serif;font-size:22px;font-weight:700;text-align:center;padding:16px 0;color:var(--ink);">${BI[q.answer].name}</div>`;
  } else if(['attr','wx','xiang'].includes(q.type)){
    const linesHtml=BL[q.guaNum].map(l=>`<div class="j-yao-row"><div class="j-yao-line ${lineClass(l)}"></div></div>`).join('');
    qHtml=`<div class="quiz-gua-show" style="flex-direction:column;align-items:center;gap:6px;"><div class="j-yao-lines">${linesHtml}</div><div style="font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;color:var(--ink);margin-top:4px;">${BI[q.guaNum].name}</div></div>`;
  } else if(['attr2gua','xiang2gua'].includes(q.type)){
    const keyEl=q.q.match(/「(.+?)」/);
    if(keyEl)qHtml=`<div style="font-family:'Noto Serif SC',serif;font-size:20px;font-weight:700;text-align:center;padding:16px 0;color:var(--gold);">「${keyEl[1]}」</div>`;
  } else if(q.uN&&q.dN){
    const all6=[...BL[q.dN],...BL[q.uN]];
    const linesHtml=all6.map(l=>`<div class="j-yao-row"><div class="j-yao-line ${lineClass(l)}"></div></div>`).join('');
    qHtml=`<div class="quiz-gua-show" style="flex-direction:column;align-items:center;gap:6px;"><div class="j-yao-lines">${linesHtml}</div></div>`;
  }

  // 打乱选项
  const shuffled=[...q.opts].sort(()=>Math.random()-.5);
  let optsHtml='';
  if(['name2lines','lines2name'].includes(q.type)){
    optsHtml=`<div class="opts">${shuffled.map(n=>{
      const lHtml=BL[n].map(l=>`<div class="j-yao-row"><div class="j-yao-line ${lineClass(l)}" style="width:36px;height:5px;"></div></div>`).join('');
      return`<button class="opt-btn" data-val="${n}" data-answer="${q.answer}" data-explain="${jGetExplain(q).replace(/"/g,'&quot;')}" onclick="jSelectOpt(this)"><div style="pointer-events:none;"><div class="j-yao-lines" style="gap:4px;">${lHtml}</div><span class="opt-sub">${BI[n].name}</span></div></button>`;
    }).join('')}</div>`;
  } else if(['attr2gua','xiang2gua'].includes(q.type)){
    optsHtml=`<div class="opts">${shuffled.map(n=>{
      const lHtml=BL[n].map(l=>`<div class="j-yao-row"><div class="j-yao-line ${lineClass(l)}" style="width:36px;height:5px;"></div></div>`).join('');
      return`<button class="opt-btn" data-val="${n}" data-answer="${q.answer}" data-explain="${jGetExplain(q).replace(/"/g,'&quot;')}" onclick="jSelectOpt(this)"><div style="pointer-events:none;"><div class="j-yao-lines" style="gap:4px;">${lHtml}</div><span class="opt-sub">${BI[n].name}</span></div></button>`;
    }).join('')}</div>`;
  } else {
    optsHtml=`<div class="opts ${q.opts.length<=2?'single':''}">${shuffled.map(o=>{
      const label=typeof o==='number'?BI[o].name:o;
      return`<button class="opt-btn" data-val="${o}" data-answer="${q.answer}" data-explain="${jGetExplain(q).replace(/"/g,'&quot;')}" onclick="jSelectOpt(this)">${label}</button>`;
    }).join('')}</div>`;
  }

  content.innerHTML=`
    <div class="quiz-card">
      <div class="quiz-label">第 ${jCurrentStep-jCurrentLesson.teaches.length+1} / ${jTotalQuizzes} 题</div>
      <div class="quiz-q">${q.q}</div>
      ${qHtml}
      ${optsHtml}
      <div class="j-explain-box" id="j-explain-box"></div>
    </div>
    <button class="j-next-btn" id="j-next-btn" onclick="jNextStep()">继续 →</button>`;
}

function jGetExplain(q){
  if(['lines2name','name2lines'].includes(q.type))return`${BI[q.answer].name}卦：${BI[q.answer].attr}·${BI[q.answer].wx}·${BI[q.answer].nat}`;
  if(q.type==='attr')return`${BI[q.guaNum].name}卦对应的属性是"${BI[q.guaNum].attr}"`;
  if(q.type==='wx')return`${BI[q.guaNum].name}卦五行属${BI[q.guaNum].wx}`;
  if(q.type==='xiang')return`${BI[q.guaNum].name}卦的类象：${q.answer}`;
  if(q.type==='attr2gua')return`"${q.q.match(/「(.+?)」/)?.[1]}"对应${BI[q.answer].name}卦（${BI[q.answer].attr}）`;
  if(q.type==='xiang2gua')return`"${q.q.match(/「(.+?)」/)?.[1]}"属于${BI[q.answer].name}卦的类象`;
  if(q.type==='tiyong_basic')return`正确答案是：${q.answer}`;
  if(q.type==='tiyong_judge')return`正确答案是：${q.answer}。记住：动爻所在的卦为用卦，另一个卦为体卦。`;
  if(q.type==='tiyong_rel')return`正确答案是：${q.answer}。五种关系：用生体（吉）、体克用（吉）、比和（平）、体生用（小凶）、用克体（凶）。`;
  if(q.type==='jixiong')return`正确答案是：${q.answer}`;
  if(q.type==='jixiong_full')return`正确答案是：${q.answer}`;
  return`正确答案是：${q.answer}`;
}

function jSelectOpt(btn){
  const val=btn.getAttribute('data-val');
  const answer=btn.getAttribute('data-answer');
  const explain=btn.getAttribute('data-explain');
  const btns=document.querySelectorAll('#j-lesson-content .opt-btn');
  btns.forEach(b=>b.disabled=true);
  const isCorrect=String(val)===String(answer);
  const explainBox=document.getElementById('j-explain-box');
  btns.forEach(b=>{
    if(String(b.getAttribute('data-val'))===String(answer))b.classList.add(isCorrect?'correct':'reveal');
    else if(b===btn&&!isCorrect)b.classList.add('wrong');
  });
  if(isCorrect){
    jCorrectCount++;
    explainBox.innerHTML=`<div class="explain-result"><span class="er-icon">✓</span><span class="er-text ok">回答正确！</span></div><div class="explain-text">${explain}</div>`;
  } else {
    jHearts--;
    jUpdateHearts();
    explainBox.innerHTML=`<div class="explain-result"><span class="er-icon">✗</span><span class="er-text ng">回答错误</span></div><div class="explain-text">${explain}</div>`;
    if(jHearts<=0){explainBox.classList.add('show');setTimeout(()=>jShowFail(),1200);return;}
  }
  explainBox.classList.add('show');
  document.getElementById('j-next-btn').classList.add('show');
}

function jNextStep(){
  jCurrentStep++;
  const totalSteps=jCurrentLesson.teaches.length+jCurrentLesson.quizzes.length;
  if(jCurrentStep>=totalSteps){jShowResult();return;}
  jRenderStep();
}

function jShowFail(){
  document.getElementById('j-lesson-content').innerHTML='';
  document.getElementById('j-fail-view').classList.add('active');
  document.getElementById('j-lp-fill').style.width='0%';
}

function jShowResult(){
  document.getElementById('j-lesson-content').innerHTML='';
  const pct=Math.round((jCorrectCount/jTotalQuizzes)*100);
  const stars=pct===100?3:pct>=67?2:1;
  document.getElementById('j-r-score').textContent=`${jCorrectCount}/${jTotalQuizzes}`;
  document.getElementById('j-r-stars').textContent=['★','★★','★★★'][stars-1];
  document.getElementById('j-r-title').textContent=pct===100?'完美通关！':pct>=67?'顺利通关！':'勉强通关';
  document.getElementById('j-r-desc').textContent=pct===100?'全部答对，掌握扎实，继续前进！':pct>=67?'答对大部分，可以继续下一关。':'有些题目需要加强，建议再练习一次。';
  document.getElementById('j-lp-fill').style.width='100%';
  const chapters = getJChapters();
  const lessons = getJLessons();
  const allOrdered = chapters.flatMap(ch=>
    ch.lessonIds.map(lid=>lessons.find(x=>String(x.id)===String(lid))).filter(Boolean)
  );
  const curIdx = allOrdered.findIndex(l=>String(l.id)===String(jCurrentLessonId));
  const nextBtn=document.getElementById('j-r-next-btn');
  if(nextBtn)nextBtn.style.display=curIdx<allOrdered.length-1?'':'none';
  const prev=jProgress[jCurrentLessonId]||{};
  jProgress[jCurrentLessonId]={done:true,stars:Math.max(stars,prev.stars||0)};
  localStorage.setItem('journey_progress',JSON.stringify(jProgress));
  document.getElementById('j-result-view').classList.add('active');
}

function jGoNextLesson(){
  const chapters = getJChapters();
  const lessons = getJLessons();
  // 按章节顺序找下一个关卡
  const allOrdered = chapters.flatMap(ch=>
    ch.lessonIds.map(lid=>lessons.find(x=>String(x.id)===String(lid))).filter(Boolean)
  );
  const curIdx = allOrdered.findIndex(l=>String(l.id)===String(jCurrentLessonId));
  const next = allOrdered[curIdx+1];
  if(next) jStartLesson(next.id);
  else jBackToMap();
}

// 页面关闭前同步
window.addEventListener('beforeunload', ()=>{ syncUserData(); });
