<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>梅花易数 · 登录 v1.0</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/400.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-serif-sc@5/700.css" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5/400.css" media="print" onload="this.media='all'">
<style>
:root{
  --ink:#1a1410;--ink2:#3d3328;--ink3:#7a6e63;--ink4:#b0a89e;
  --paper:#f5f0e8;--paper2:#ede7d8;--paper3:#e0d8c8;
  --gold:#b8912a;--gold2:#d4aa4a;--red:#8b2020;--jade:#2d6e5a;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  font-family:'Noto Sans SC',sans-serif;
  background:var(--paper);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  background:
    radial-gradient(ellipse at 12% 15%,rgba(184,145,42,.07) 0%,transparent 45%),
    radial-gradient(ellipse at 88% 85%,rgba(139,32,32,.05) 0%,transparent 45%);
  pointer-events:none;
}

.login-wrap{
  width:100%;
  max-width:360px;
  position:relative;
  z-index:1;
}

/* Logo */
.logo{text-align:center;margin-bottom:40px;}
.logo-main{font-family:'Noto Serif SC',serif;font-size:28px;font-weight:700;color:var(--ink);letter-spacing:.2em;}
.logo-dot{display:inline-block;width:5px;height:5px;background:var(--gold);border-radius:50%;margin:0 8px;vertical-align:middle;}
.logo-sub{font-size:12px;color:var(--ink4);letter-spacing:.2em;margin-top:6px;}

/* 卡片 */
.login-card{
  background:rgba(237,231,216,.5);
  border:1px solid var(--paper3);
  border-radius:16px;
  padding:32px 28px;
}
.card-title{
  font-family:'Noto Serif SC',serif;
  font-size:16px;
  font-weight:500;
  color:var(--ink2);
  margin-bottom:24px;
  text-align:center;
  letter-spacing:.08em;
}

/* 输入框 */
.field{margin-bottom:16px;}
.field-label{font-size:12px;color:var(--ink3);margin-bottom:6px;letter-spacing:.04em;}
.field-input{
  width:100%;
  background:rgba(245,240,232,.9);
  border:1px solid var(--paper3);
  border-radius:8px;
  padding:12px 14px;
  font-family:'Noto Sans SC',sans-serif;
  font-size:15px;
  color:var(--ink);
  outline:none;
  transition:border-color .2s;
}
.field-input:focus{border-color:var(--gold2);}
.field-input::placeholder{color:var(--ink4);}

/* 错误提示 */
.error-msg{
  font-size:12px;
  color:var(--red);
  text-align:center;
  margin-bottom:14px;
  min-height:18px;
  opacity:0;
  transition:opacity .2s;
}
.error-msg.show{opacity:1;}

/* 登录按钮 */
.login-btn{
  width:100%;
  background:var(--ink);
  color:var(--paper);
  border:none;
  border-radius:8px;
  padding:14px;
  font-family:'Noto Serif SC',serif;
  font-size:16px;
  font-weight:500;
  letter-spacing:.25em;
  cursor:pointer;
  transition:all .2s;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
.login-btn:hover{background:var(--ink2);}
.login-btn:active{transform:scale(.98);}
.login-btn:disabled{background:var(--ink4);cursor:not-allowed;transform:none;}

/* loading 圆圈 */
.spinner{
  width:16px;height:16px;
  border:2px solid rgba(245,240,232,.3);
  border-top-color:var(--paper);
  border-radius:50%;
  animation:spin .6s linear infinite;
  display:none;
}
.login-btn.loading .spinner{display:block;}
.login-btn.loading .btn-text{opacity:.6;}
@keyframes spin{to{transform:rotate(360deg)}}

/* 底部装饰 */
.footer-deco{
  text-align:center;
  margin-top:28px;
  font-family:'Noto Serif SC',serif;
  font-size:12px;
  color:var(--ink4);
  letter-spacing:.1em;
}
</style>
</head>
<body>

<div class="login-wrap">
  <div class="logo">
    <div class="logo-main">梅花<span class="logo-dot"></span>易数</div>
    <div class="logo-sub">PLUM BLOSSOM ORACLE</div>
  </div>

  <div class="login-card">
    <div class="card-title">登 录</div>

    <div class="field">
      <div class="field-label">用户名</div>
      <input class="field-input" type="text" id="username" placeholder="请输入用户名" autocomplete="username" autocapitalize="off">
    </div>

    <div class="field">
      <div class="field-label">密码</div>
      <input class="field-input" type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>

    <div class="error-msg" id="error-msg"></div>

    <button class="login-btn" id="login-btn" onclick="doLogin()">
      <div class="spinner"></div>
      <span class="btn-text">登 录</span>
    </button>
  </div>

  <div class="footer-deco">观天地之变，知万物之理 <span style="opacity:.5;font-size:11px;">v1.0</span></div>
</div>

<script>
/* ── COS 配置 ── */
const COS_CONFIG = {
  SecretId:  'AKID9B8sOgliV8ZoqeIk074oKcjiV7ZrPuDJ',
  SecretKey: 'znOlura5MRK4as0viYIrJXXM0fBao11n',
  Bucket:    'meihua-yishu-1433827621',
  Region:    'ap-shanghai',
};

/* ── 工具函数 ── */
function cosUrl(key){
  return `https://${COS_CONFIG.Bucket}.cos.${COS_CONFIG.Region}.myqcloud.com/${key}`;
}

// HMAC-SHA1 签名（用于 COS 请求鉴权）
async function hmacSHA1(key, msg){
  const enc = new TextEncoder();
  const k = await crypto.subtle.importKey('raw', enc.encode(key), {name:'HMAC',hash:'SHA-1'}, false, ['sign']);
  const sig = await crypto.subtle.sign('HMAC', k, enc.encode(msg));
  return btoa(String.fromCharCode(...new Uint8Array(sig)));
}

// SHA1
async function sha1Hex(msg){
  const buf = await crypto.subtle.digest('SHA-1', new TextEncoder().encode(msg));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}

// 生成 COS 签名
async function cosSign(method, path){
  const now = Math.floor(Date.now()/1000);
  const expire = now + 600;
  const keyTime = `${now};${expire}`;
  const signKey = await hmacSHA1(COS_CONFIG.SecretKey, keyTime);
  const httpString = `${method.toLowerCase()}\n${path}\n\n\n`;
  const strToSign = `sha1\n${keyTime}\n${await sha1Hex(httpString)}\n`;
  const signature = await hmacSHA1(signKey, strToSign);
  return `q-sign-algorithm=sha1&q-ak=${COS_CONFIG.SecretId}&q-sign-time=${keyTime}&q-key-time=${keyTime}&q-header-list=&q-url-param-list=&q-signature=${signature}`;
}

// 读取 COS 文件
async function cosGet(key){
  const path = `/${key}`;
  const auth = await cosSign('GET', path);
  const res = await fetch(cosUrl(key), {
    headers: { 'Authorization': auth }
  });
  if(!res.ok) return null;
  return await res.json();
}

// 写入 COS 文件
async function cosPut(key, data){
  const path = `/${key}`;
  const body = JSON.stringify(data);
  const auth = await cosSign('PUT', path);
  const res = await fetch(cosUrl(key), {
    method: 'PUT',
    headers: {
      'Authorization': auth,
      'Content-Type': 'application/json'
    },
    body,
  });
  return res.ok;
}

// 简单密码 hash（SHA-1）
async function hashPassword(pwd){
  return await sha1Hex('meihua_' + pwd + '_yishu');
}

/* ── 登录逻辑 ── */
function showError(msg){
  const el = document.getElementById('error-msg');
  el.textContent = msg;
  el.classList.add('show');
}
function hideError(){
  document.getElementById('error-msg').classList.remove('show');
}

async function doLogin(){
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  hideError();

  if(!username){ showError('请输入用户名'); return; }
  if(!password){ showError('请输入密码'); return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true;
  btn.classList.add('loading');

  try{
    // 读取用户文件
    const userData = await cosGet(`users/${username}.json`);
    if(!userData){
      showError('用户名或密码错误');
      return;
    }

    // 验证密码
    const hash = await hashPassword(password);
    if(userData.passwordHash !== hash){
      showError('用户名或密码错误');
      return;
    }

    // 登录成功，存 session
    sessionStorage.setItem('meihua_user', JSON.stringify({
      username,
      nickname: userData.nickname || username,
      loginTime: Date.now(),
    }));

    // 跳转
    window.location.href = 'learn.html';

  }catch(e){
    console.error(e);
    showError('网络错误，请稍后重试');
  }finally{
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

// 回车登录
document.addEventListener('keydown', e=>{
  if(e.key === 'Enter') doLogin();
});

// 已登录则直接跳转
if(sessionStorage.getItem('meihua_user')){
  window.location.href = 'learn.html';
}
</script>
</body>
</html>
